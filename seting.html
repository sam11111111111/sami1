<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Option 1: Include in HTML -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Settings</title>
    <style>
        body {
            background-repeat: no-repeat;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
        

            padding: 20px;
            border-radius: 10px;
        }
        label, input {
            display: block;
            margin: 10px 0;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #menu{

    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 46px;

    color: white;
}
    </style>
</head>
<body>
   <a href="for_2.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>



    <div class="container">
        <h2>ማስተካከያ</h2>
        <label for="gamePrice">የጨዋታ ዋጋ (በጨዋታ):</label>
        <input type="number" id="gamePrice" placeholder="Enter price">

        <label for="timerDuration">የሰዓት ቆጣሪ ቆይታ (በደቂቃ):</label>
        <input type="number" id="timerDuration" min="1" placeholder="Enter duration">

        <label for="savingPercentage"> ቁጠባ %:</label>
        <input type="number" id="savingPercentage" min="1" placeholder="Enter saving %">

<label for="numPS">📌 Enter Number of PlayStations: </label>
<input type="number" id="numPS" min="1" max="5" placeholder="Enter count" required>

        <button onclick="saveSettings()">Save Settings</button><br>
       <!-- <a href="for_2.html"><button> Home </button></a> -->
    </div>


   <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    </script>




    <script>
        
 
        function saveSettings() {



            const numPS = document.getElementById("numPS").value;
            const gamePrice = document.getElementById("gamePrice").value;
            const timerDuration = document.getElementById("timerDuration").value;
            const savingPercentage = document.getElementById("savingPercentage").value;
            if (numPS < 1 || numPS > 6){
                alert("በጣም ብዙ ps ቁጥር!");
                return
            }
            localStorage.setItem("gamePrice", gamePrice);
            localStorage.setItem("numPS", numPS);
            localStorage.setItem("timerDuration", timerDuration);
            localStorage.setItem("savingPercentage", savingPercentage);
            
            alert("በተሳካ ሁኔታ ተከናውኗል!");
        }

        // Load saved settings
        window.onload = function() {
            document.getElementById("gamePrice").value = localStorage.getItem("gamePrice") || "";
            document.getElementById("timerDuration").value = localStorage.getItem("timerDuration") || "";
            document.getElementById("savingPercentage").value = localStorage.getItem("savingPercentage") || "";
            document.getElementById("numPS").value = localStorage.getItem("numPS") || "";
        }
    </script>
</body>
</html>
