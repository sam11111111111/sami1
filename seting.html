        }
        #menu{

    position: fixed;
    top: 10px;

    color: white;
}




/* Light mode styles */
body.light-mode {
    background-color: #f5f5f5;
    color: #333;
}

.light-mode .count p {
    background-color: #e0e0e0;
    color: #333;
}



.light-mode #lyew {

    color: #F6F0F0;

    border: none;

</head>
<body>
   <a href="for_2.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>

<button id="themeToggle" style="position:fixed; top:5px; right:10px; padding:5px 10px; width: 15%;">
    <i class="bi bi-moon-fill"></i> <!-- Default dark mode icon -->
</button>


    <div class="container">
        <h2>ማስተካከያ</h2>
        <label for="gamePrice">የጨዋታ ዋጋ (በጨዋታ):</label>
        <input type="number" id="gamePrice" placeholder="ዋጋ አስገባ">

        <label for="timerDuration">የሰዓት ቆጣሪ ቆይታ (በደቂቃ):</label>
        <input type="number" id="timerDuration" min="1" placeholder="የሰዓት ቆይታ">

        <label for="savingPercentage"> ቁጠባ %:</label>
        <input type="number" id="savingPercentage" min="1" placeholder="ቁጠባ አስገባ %">

<label for="numPS"> የመጫወቻ ቦታ ብዛት: </label>
<input type="number" id="numPS" min="1" max="5" placeholder="የመጫወቻ ብዛት" required>

        <button onclick="saveSettings()">Save Settings</button><br>
       <!-- <a href="for_2.html"><button> Home </button></a> -->
    </div>


   <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    </script>






<script type="text/javascript">
// Theme management
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.classList.toggle('light-mode', savedTheme === 'light');
    updateThemeIcon();
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    localStorage.setItem('theme', currentTheme);
    updateThemeIcon();
}

function updateThemeIcon() {
    const icon = document.querySelector('#themeToggle i');
    if (document.body.classList.contains('light-mode')) {
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
    } else {
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
    }
}

// Initialize theme and add event listener
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
});
</script>








    <script>
        
 
        function saveSettings() {



            const numPS = document.getElementById("numPS").value;
            const gamePrice = document.getElementById("gamePrice").value;
            const timerDuration = document.getElementById("timerDuration").value;
            const savingPercentage = document.getElementById("savingPercentage").value;
            if (numPS < 1 || numPS > 6){
                alert("በጣም ብዙ ps ቁጥር!");
                return
            }
            localStorage.setItem("gamePrice", gamePrice);
            localStorage.setItem("numPS", numPS);
            localStorage.setItem("timerDuration", timerDuration);
            localStorage.setItem("savingPercentage", savingPercentage);
            
            alert("በተሳካ ሁኔታ ተከናውኗል!");
        }

        // Load saved settings
        window.onload = function() {
            document.getElementById("gamePrice").value = localStorage.getItem("gamePrice") || "";
            document.getElementById("timerDuration").value = localStorage.getItem("timerDuration") || "";
            document.getElementById("savingPercentage").value = localStorage.getItem("savingPercentage") || "";
            document.getElementById("numPS").value = localStorage.getItem("numPS") || "";
        }
    </script>
</body>
</html>
