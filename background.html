<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Changer</title>
    <style>
        body {
            text-align: center;
            transition: background 0.5s ease;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-repeat: no-repeat;
            background-size: cover;
               transition: background 0.5s ease-in-out;
            padding: 20px;
        }
 
        .thumbnail {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .thumbnail:hover {
            transform: scale(1.1);
        }
        a {
            margin-top: 20px;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border-radius: 5px;
        }




    .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            color: white;
            max-width: 800px;
            width: 100%;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-width: 700px;
            justify-content: center;
        }



    </style>
</head>
<body>
<div class="header">
    <h1>Choose a Background Image</h1>
    </div>

   <div class="container">
        <h1>Select a Background</h1>

        <div class="grid-container">


        <img src="images (1).jpg" class="thumbnail" onclick="changeBackground('images (1).jpg')">
        <img src="ps5.png" class="thumbnail" onclick="changeBackground('ps5.png')">
        <img src="ps6.png" class="thumbnail" onclick="changeBackground('ps6.png')">
        <img src="ps41.png" class="thumbnail" onclick="changeBackground('ps41.png')">
        <img src="wall/wa1.png" class="thumbnail" onclick="changeBackground('wall/wa1.png')">

 
        <img src="wall/wa2.jpg" class="thumbnail" onclick="changeBackground('wall/wa2.jpg')">
        <img src="wall/wa3.jpg" class="thumbnail" onclick="changeBackground('wall/wa3.jpg')">
        <img src="wall/wa4.jpg" class="thumbnail" onclick="changeBackground('wall/wa4.jpg')">
        <img src="wall/wa5.jpg" class="thumbnail" onclick="changeBackground('wall/wa5.jpg')">

        <img src="wall/wa6.jpg" class="thumbnail" onclick="changeBackground('wall/wa6.jpg')">
        <img src="wall/wa7.jpg" class="thumbnail" onclick="changeBackground('wall/wa7.jpg')">
        <img src="wall/wa8.jpg" class="thumbnail" onclick="changeBackground('wall/wa8.jpg')">


        <img src="wall/wa9.jpg" class="thumbnail" onclick="changeBackground('wall/wa9.jpg')">
        <img src="wall/wa10.jpg" class="thumbnail" onclick="changeBackground('wall/wa10.jpg')">
        <img src="wall/wa11.jpg" class="thumbnail" onclick="changeBackground('wall/wa11.jpg')">




</div>

    <a href="for_2.html">Apply and Back</a>

    <script>
        function changeBackground(imageUrl) {
            localStorage.setItem("bgImage", imageUrl);
            document.body.style.backgroundImage = `url(${imageUrl})`;
        }

        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") || 'https://source.unsplash.com/1920x1080?nature'})`;
    </script>

</body>
</html>
