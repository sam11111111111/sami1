<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Changer</title>
    <style>
        body {
            text-align: center;
            transition: background 0.5s ease;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .image-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .thumbnail {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .thumbnail:hover {
            transform: scale(1.1);
        }
        a {
            margin-top: 20px;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Choose a Background Image</h1>
    
    <div class="image-container">
        <img src="images (1).jpg" class="thumbnail" onclick="changeBackground('images (1).jpg')">
        <img src="ps5.png" class="thumbnail" onclick="changeBackground('ps5.png')">
        <img src="ps6.png" class="thumbnail" onclick="changeBackground('ps6.png')">
        <img src="ps41.png" class="thumbnail" onclick="changeBackground('ps41.png')">
        <img src="images.jpg" class="thumbnail" onclick="changeBackground('images.jpg')">
    </div>

    <a href="for_2.html">Back to Home</a>

    <script>
        function changeBackground(imageUrl) {
            localStorage.setItem("bgImage", imageUrl);
            document.body.style.backgroundImage = `url(${imageUrl})`;
        }

        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") || 'https://source.unsplash.com/1920x1080?nature'})`;
    </script>

</body>
</html>
