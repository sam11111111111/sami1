<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird with PS4 Controller</title>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controller {
            position: relative;
            width: 100%;
            height: 30vh;
            min-height: 200px;
            background-color: #333;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Controller body shape */
        .controller:before {
            content: '';
            position: absolute;
            top: 30px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% - 60px);
            background-color: #222;
            border-radius: 50px 50px 0 0;
        }

        /* Light bar */
        .light-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 8px;
            background-color: #0066cc;
            border-radius: 4px;
        }

        /* Left joystick */
        .joystick-left {
            position: absolute;
            bottom: 30%;
            left: 20%;
            width: 12vw;
            height: 12vw;
            max-width: 80px;
            max-height: 80px;
            background-color: #111;
            border-radius: 50%;
            transform: translate(-50%, 50%);
            touch-action: none;
            will-change: transform;
            transition: transform 0.05s linear;
        }

        .joystick-left:before {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            background-color: #444;
            border-radius: 50%;
        }

        /* Action buttons */
        .action-buttons {
            position: absolute;
            bottom: 30%;
            right: 20%;
            width: 20vw;
            height: 20vw;
            max-width: 100px;
            max-height: 100px;
            transform: translateX(50%);
        }

        .button {
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.1s;
            will-change: transform;
        }

        .button-cross {
            bottom: 0;
            left: 30%;
            background-color: #3333ff;
            font-size: 4vw;
        }

        /* Shoulder buttons */
        .shoulder-left, .shoulder-right {
            position: absolute;
            width: 25%;
            height: 5vh;
            background-color: #111;
            border-radius: 10px 10px 0 0;
            transition: all 0.1s;
        }

        .shoulder-left {
            top: 0;
            left: 15%;
        }

        .shoulder-right {
            top: 0;
            right: 15%;
        }

        /* PS button */
        .ps-button {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 8vw;
            height: 8vw;
            max-width: 40px;
            max-height: 40px;
            background-color: #444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 3vw;
            transition: all 0.1s;
        }

        /* Active state for buttons */
        .button:active, .shoulder-left:active, 
        .shoulder-right:active, .ps-button:active {
            background-color: #0066cc;
            transform: translateY(2px);
        }

        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }

        .start-button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }
            
            .game-container {
                width: 70%;
                height: 100vh;
            }
            
            .controller {
                width: 30%;
                height: 100vh;
                border-radius: 0;
            }
            
            .controller:before {
                top: -10px;
                left: 30px;
                width: calc(100% - 60px);
                height: calc(100% + 20px);
                border-radius: 0 0 50px 50px;
            }
            
            .joystick-left {
                bottom: 20%;
                left: 50%;
                transform: translate(-50%, 50%);
            }
            
            .action-buttons {
                bottom: 20%;
                right: 20%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="game-canvas"></canvas>
        <div class="score-display" id="score-display">0</div>
        <div class="game-over" id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-button">Play Again</button>
        </div>
        <div class="start-screen" id="start-screen">
            <h1>Flappy Bird</h1>
            <p>Use the left joystick to control the bird</p>
            <p>Press X to jump</p>
            <button class="start-button" id="start-button">Start Game</button>
        </div>
    </div>

    <div class="controller">
        <div class="light-bar"></div>
        
        <div class="joystick-left" id="joystick-left"></div>
        
        <div class="action-buttons">
            <div class="button button-cross" id="cross">✕</div>
        </div>
        
        <div class="shoulder-left" id="l1"></div>
        <div class="shoulder-right" id="r1"></div>
        
        <div class="ps-button" id="ps-button">PS</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = 0;
        let lastFrameTime = 0;
        let gameSpeed = 2;
        
        // Bird properties
        const bird = {
            x: 100,
            y: canvas.height / 2,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.5,
            jumpForce: -10,
            color: '#FFD700'
        };
        
        // Pipes
        let pipes = [];
        const pipeWidth = 80;
        const pipeGap = 200;
        let pipeTimer = 0;
        const pipeInterval = 1500; // ms
        
        // Resize canvas to fit container
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Reset bird position on resize
            if (gameRunning) {
                bird.y = canvas.height / 2;
            }
        }
        
        // Initialize game
        function initGame() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            pipeTimer = 0;
            gameSpeed = 2;
            scoreDisplay.textContent = '0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            
            // Start game loop
            lastFrameTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        // Game loop
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;
            
            update(deltaTime);
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update(deltaTime) {
            // Update bird
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            
            // Check boundaries
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
            
            if (bird.y + bird.height > canvas.height) {
                gameOver();
                return;
            }
            
            // Update pipes
            pipeTimer += deltaTime;
            if (pipeTimer > pipeInterval) {
                createPipe();
                pipeTimer = 0;
            }
            
            // Move pipes and check collisions
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= gameSpeed;
                
                // Check if bird passed the pipe
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Increase difficulty
                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                    }
                }
                
                // Check collision
                if (
                    bird.x < pipes[i].x + pipeWidth &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].topHeight || bird.y + bird.height > pipes[i].topHeight + pipeGap)
                ) {
                    gameOver();
                    return;
                }
                
                // Remove off-screen pipes
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }
        
        // Render game
        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw bird
            ctx.fillStyle = bird.color;
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            
            // Draw eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bird.x + 30, bird.y + 10, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(bird.x + 30, bird.y + 10, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw beak
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(bird.x + 40, bird.y + 15);
            ctx.lineTo(bird.x + 50, bird.y + 15);
            ctx.lineTo(bird.x + 40, bird.y + 20);
            ctx.fill();
            
            // Draw pipes
            ctx.fillStyle = '#2E8B57';
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Bottom pipe
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height - pipe.topHeight - pipeGap);
            });
        }
        
        // Create new pipe
        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight - 20; // 20 for ground
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight,
                passed: false
            });
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';
            
            if (score > highScore) {
                highScore = score;
            }
        }
        
        // Jump function
        function jump() {
            if (gameRunning) {
                bird.velocity = bird.jumpForce;
            }
        }
        
        // Initialize controller
        function initController() {
            const joystickLeft = document.getElementById('joystick-left');
            const crossButton = document.getElementById('cross');
            const psButton = document.getElementById('ps-button');
            
            // Joystick control
            let touchId = null;
            let joystickActive = false;
            
            function handleJoystickMove(clientX, clientY) {
                if (!joystickActive) return;
                
                const rect = joystickLeft.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const maxDistance = rect.width / 2;
                
                const deltaX = clientX - centerX;
                const deltaY = clientY - centerY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Limit movement
                const moveDistance = Math.min(distance, maxDistance);
                const angle = Math.atan2(deltaY, deltaX);
                const moveX = moveDistance * Math.cos(angle);
                const moveY = moveDistance * Math.sin(angle);
                
                // Update joystick position
                joystickLeft.style.transform = `translate(calc(-50% + ${moveX}px), calc(50% + ${moveY}px)`;
                
                // Control bird with vertical movement
                if (gameRunning) {
                    bird.velocity = (moveY / maxDistance) * 15; // Scale the effect
                }
            }
            
            joystickLeft.addEventListener('touchstart', (e) => {
                if (touchId === null) {
                    const touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    joystickActive = true;
                    handleJoystickMove(touch.clientX, touch.clientY);
                    e.preventDefault();
                }
            });
            
            document.addEventListener('touchmove', (e) => {
                if (touchId !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                            e.preventDefault();
                            break;
                        }
                    }
                }
            }, { passive: false });
            
            document.addEventListener('touchend', (e) => {
                if (touchId !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touchId = null;
                            joystickActive = false;
                            joystickLeft.style.transform = 'translate(-50%, 50%)';
                            e.preventDefault();
                            break;
                        }
                    }
                }
            });
            
            // Button controls
            crossButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                jump();
                crossButton.style.transform = 'translateY(2px)';
                crossButton.style.backgroundColor = '#0066cc';
            });
            
            crossButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                crossButton.style.transform = '';
                crossButton.style.backgroundColor = '#3333ff';
            });
            
            psButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!gameRunning) {
                    initGame();
                }
                psButton.style.transform = 'translateY(2px)';
                psButton.style.backgroundColor = '#0066cc';
            });
            
            psButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                psButton.style.transform = '';
                psButton.style.backgroundColor = '#444';
            });
            
            // Keyboard fallback for testing
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    jump();
                }
            });
        }
        
        // Start game when button clicked
        startButton.addEventListener('click', () => {
            startScreen.style.display = 'none';
            initGame();
        });
        
        restartButton.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            initGame();
        });
        
        // Initialize everything
        resizeCanvas();
        initController();
    </script>
</body>
</html>
