<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Game Collection</title>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background-repeat: no-repeat;
            background-size: cover;

        }

        .game-selection {

            display: flex;
            position: fixed;
            top: 95px;

            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
            size: portrait;

        }

        .game-option {
            width: 200px;
            height: 90px;
            padding: 20px;
            /*background-color: #333;*/
             background: rgba(0, 0, 0, 0.5);

            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .game-option:hover {
            transform: scale(1.05);
            background-color: #444;
        }

        .game-option:active {
            transform: scale(0.95);
            background-color: #0066cc;
        }

        .game-option h2 {
            margin-top: 0;
        }

        .game-option p {
            margin-bottom: 0;
        }

        .controller-image {
            width: 100px;
            position: fixed;
            top: 10px;
            margin-bottom: 30px;
        }

        @media (orientation: landscape) {
            .game-selection {
                flex-direction: row;
                gap: 50px;
            }
        }
         #menu{

    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 46px;

    color: white;
}
    </style>
</head>
<body>
     <a href="for_2.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>


       <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    </script>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Playstation_logo_colour.svg/1200px-Playstation_logo_colour.svg.png" class="controller-image" alt="PS Controller" >
    
    <div class="game-selection">
        <div class="game-option" id="game1">
            <h2>Flappy Bird</h2>
            <p>flappy bird game</p>
        </div>
        
        <div class="game-option" id="game2">
            <h2>Game 2</h2>
            <p>Another fun game</p>
        </div>

          <div class="game-option" id="game3">
            <h2>Game 3</h2>
            <p>Car Game</p>
        </div>

        
    </div>

    <script>
        document.getElementById('game1').addEventListener('click', () => {
            window.location.href = 'flappy-bird.html';
        });

        document.getElementById('game2').addEventListener('click', () => {
            window.location.href = 'for-2.html';
        });

          document.getElementById('game3').addEventListener('click', () => {
            window.location.href = 'car.html';
        });
         
    </script>
</body>
</html>
