<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile PS4 Controller</title>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            padding: 20px;
            font-size: 1.5rem;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 40vh;
            background-color: #333;
            border-bottom: 2px solid #444;
        }

        .controlled-box {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #0066cc;
            border-radius: 5px;
            transition: all 0.08s ease-out;
            will-change: transform;
        }

        .controller {
            position: relative;
            width: 100%;
            height: 60vh;
            background-color: #333;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Controller body shape */
        .controller:before {
            content: '';
            position: absolute;
            top: 30px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% - 60px);
            background-color: #222;
            border-radius: 50px 50px 0 0;
        }

        /* Light bar */
        .light-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 8px;
            background-color: #0066cc;
            border-radius: 4px;
        }

        /* Touchpad */
        .touchpad {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 12vh;
            background-color: #111;
            border-radius: 5px;
        }

        /* Left joystick */
        .joystick-left {
            position: absolute;
            top: 45%;
            left: 15%;
            width: 12vw;
            height: 12vw;
            max-width: 80px;
            max-height: 80px;
            background-color: #111;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            will-change: transform;
            transition: transform 0.05s linear;
        }

        .joystick-left:before {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            background-color: #444;
            border-radius: 50%;
        }

        /* Right joystick */
        .joystick-right {
            position: absolute;
            top: 45%;
            right: 15%;
            width: 12vw;
            height: 12vw;
            max-width: 80px;
            max-height: 80px;
            background-color: #111;
            border-radius: 50%;
            transform: translate(50%, -50%);
            touch-action: none;
            will-change: transform;
            transition: transform 0.05s linear;
        }

        .joystick-right:before {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            background-color: #444;
            border-radius: 50%;
        }

        /* D-pad */
        .dpad {
            position: absolute;
            bottom: 20%;
            left: 15%;
            width: 20vw;
            height: 20vw;
            max-width: 100px;
            max-height: 100px;
            transform: translateX(-50%);
        }

        .dpad-up, .dpad-down, .dpad-left, .dpad-right {
            position: absolute;
            width: 40%;
            height: 40%;
            background-color: #111;
            transition: background-color 0.1s;
        }

        .dpad-up {
            top: 0;
            left: 30%;
            border-radius: 5px 5px 0 0;
        }

        .dpad-down {
            bottom: 0;
            left: 30%;
            border-radius: 0 0 5px 5px;
        }

        .dpad-left {
            top: 30%;
            left: 0;
            border-radius: 5px 0 0 5px;
        }

        .dpad-right {
            top: 30%;
            right: 0;
            border-radius: 0 5px 5px 0;
        }

        /* Action buttons */
        .action-buttons {
            position: absolute;
            bottom: 20%;
            right: 15%;
            width: 20vw;
            height: 20vw;
            max-width: 100px;
            max-height: 100px;
            transform: translateX(50%);
        }

        .button {
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.1s;
            will-change: transform;
        }

        .button-triangle {
            top: 0;
            left: 30%;
            background-color: #ff3333;
            font-size: 4vw;
        }

        .button-circle {
            top: 30%;
            right: 0;
            background-color: #33aa33;
            font-size: 4vw;
        }

        .button-cross {
            bottom: 0;
            left: 30%;
            background-color: #3333ff;
            font-size: 4vw;
        }

        .button-square {
            top: 30%;
            left: 0;
            background-color: #ffcc00;
            font-size: 4vw;
        }

        /* Shoulder buttons */
        .shoulder-left, .shoulder-right {
            position: absolute;
            width: 25%;
            height: 5vh;
            background-color: #111;
            border-radius: 10px 10px 0 0;
            transition: all 0.1s;
        }

        .shoulder-left {
            top: 0;
            left: 15%;
        }

        .shoulder-right {
            top: 0;
            right: 15%;
        }

        /* Triggers */
        .trigger-left, .trigger-right {
            position: absolute;
            width: 20%;
            height: 6vh;
            background-color: #111;
            border-radius: 0 0 10px 10px;
            transition: all 0.1s;
        }

        .trigger-left {
            top: 5vh;
            left: 17%;
        }

        .trigger-right {
            top: 5vh;
            right: 17%;
        }

        /* Options and Share buttons */
        .options-button, .share-button {
            position: absolute;
            width: 10vw;
            height: 3vh;
            max-width: 50px;
            background-color: #444;
            border-radius: 5px;
            transition: all 0.1s;
        }

        .options-button {
            top: 30%;
            right: 25%;
        }

        .share-button {
            top: 30%;
            left: 25%;
        }

        /* PS button */
        .ps-button {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 8vw;
            height: 8vw;
            max-width: 40px;
            max-height: 40px;
            background-color: #444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 3vw;
            transition: all 0.1s;
        }

        /* Active state for buttons */
        .button:active, .dpad-up:active, .dpad-down:active, 
        .dpad-left:active, .dpad-right:active, .shoulder-left:active, 
        .shoulder-right:active, .trigger-left:active, .trigger-right:active,
        .options-button:active, .share-button:active, .ps-button:active,
        .touchpad:active {
            background-color: #0066cc;
            transform: translateY(2px);
        }

        .output {
            position: absolute;
            bottom: 2vh;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            width: 90%;
            font-size: 2.5vw;
        }

        .instructions {
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 3vw;
        }
    </style>
</head>
<body>
    <div class="orientation-warning" id="orientation-warning">
        <div>
            <h2>Please rotate your device to portrait mode</h2>
            <p>This controller works best in portrait orientation</p>
        </div>
    </div>

    <div class="game-area">
        <div class="controlled-box" id="box"></div>
    </div>

    <div class="controller">
        <div class="light-bar"></div>
        <div class="touchpad" id="touchpad"></div>
        
        <div class="joystick-left" id="joystick-left"></div>
        <div class="joystick-right" id="joystick-right"></div>
        
        <div class="dpad">
            <div class="dpad-up" id="dpad-up"></div>
            <div class="dpad-down" id="dpad-down"></div>
            <div class="dpad-left" id="dpad-left"></div>
            <div class="dpad-right" id="dpad-right"></div>
        </div>
        
        <div class="action-buttons">
            <div class="button button-triangle" id="triangle">△</div>
            <div class="button button-circle" id="circle">○</div>
            <div class="button button-cross" id="cross">✕</div>
            <div class="button button-square" id="square">□</div>
        </div>
        
        <div class="shoulder-left" id="l1"></div>
        <div class="shoulder-right" id="r1"></div>
        
        <div class="trigger-left" id="l2"></div>
        <div class="trigger-right" id="r2"></div>
        
        <div class="options-button" id="options"></div>
        <div class="share-button" id="share"></div>
        
        <div class="ps-button" id="ps-button">PS</div>
        
        <div class="output" id="output">Touch and drag the left joystick to move</div>
    </div>

    <script>
        // Mobile detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile) {
            document.body.innerHTML = `
                <div style="color: white; text-align: center; padding: 20px;">
                    <h1>This is a mobile-only experience</h1>
                    <p>Please open this page on a smartphone or tablet</p>
                </div>
            `;
        }

        // Orientation check
        const orientationWarning = document.getElementById('orientation-warning');
        function checkOrientation() {
            if (window.innerHeight < window.innerWidth) {
                orientationWarning.style.display = 'flex';
            } else {
                orientationWarning.style.display = 'none';
            }
        }
        
        // Initial check
        checkOrientation();
        
        // Add event listener
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        // Get all button elements
        const buttons = {
            triangle: document.getElementById('triangle'),
            circle: document.getElementById('circle'),
            cross: document.getElementById('cross'),
            square: document.getElementById('square'),
            dpadUp: document.getElementById('dpad-up'),
            dpadDown: document.getElementById('dpad-down'),
            dpadLeft: document.getElementById('dpad-left'),
            dpadRight: document.getElementById('dpad-right'),
            l1: document.getElementById('l1'),
            r1: document.getElementById('r1'),
            l2: document.getElementById('l2'),
            r2: document.getElementById('r2'),
            options: document.getElementById('options'),
            share: document.getElementById('share'),
            psButton: document.getElementById('ps-button'),
            touchpad: document.getElementById('touchpad')
        };

        const output = document.getElementById('output');
        const joystickLeft = document.getElementById('joystick-left');
        const joystickRight = document.getElementById('joystick-right');
        const box = document.getElementById('box');
        const gameArea = document.querySelector('.game-area');

        // Box properties
        let boxX = gameArea.offsetWidth / 2 - 25;
        let boxY = gameArea.offsetHeight / 2 - 25;
        let boxSize = 50;
        let boxColor = '#0066cc';
        let boxSpeed = 5;
        let boxRotation = 0;
        let boxVelocityX = 0;
        let boxVelocityY = 0;
        const friction = 0.9; // Friction coefficient for smooth stopping

        // Animation frame for smooth movement
        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            // Apply velocity with time correction
            if (Math.abs(boxVelocityX) > 0.1 || Math.abs(boxVelocityY) > 0.1) {
                boxX += boxVelocityX * (deltaTime / 16); // Normalize to 60fps
                boxY += boxVelocityY * (deltaTime / 16);
                
                // Apply friction
                boxVelocityX *= friction;
                boxVelocityY *= friction;
                
                // Boundary checking
                boxX = Math.max(0, Math.min(gameArea.offsetWidth - boxSize, boxX));
                boxY = Math.max(0, Math.min(gameArea.offsetHeight - boxSize, boxY));
                
                updateBoxPosition();
            }
            
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        // Update box position
        function updateBoxPosition() {
            box.style.left = `${boxX}px`;
            box.style.top = `${boxY}px`;
            box.style.width = `${boxSize}px`;
            box.style.height = `${boxSize}px`;
            box.style.backgroundColor = boxColor;
            box.style.transform = `rotate(${boxRotation}deg)`;
        }

        // Initialize box position
        updateBoxPosition();

        // Add touch event listeners to all buttons
        Object.keys(buttons).forEach(button => {
            buttons[button].addEventListener('touchstart', (e) => {
                e.preventDefault();
                buttons[button].style.transform = 'translateY(2px)';
                buttons[button].style.backgroundColor = '#0066cc';
                output.textContent = `Button pressed: ${button.toUpperCase()}`;
                
                // Button actions
                switch(button) {
                    case 'triangle':
                        boxSize = Math.min(100, boxSize + 10);
                        break;
                    case 'circle':
                        boxSize = Math.max(20, boxSize - 10);
                        break;
                    case 'cross':
                        boxColor = `hsl(${Math.random() * 360}, 70%, 50%)`;
                        break;
                    case 'square':
                        boxX = gameArea.offsetWidth / 2 - boxSize / 2;
                        boxY = gameArea.offsetHeight / 2 - boxSize / 2;
                        boxRotation = 0;
                        boxVelocityX = 0;
                        boxVelocityY = 0;
                        break;
                    case 'dpadUp':
                        boxVelocityY = -boxSpeed * 2;
                        break;
                    case 'dpadDown':
                        boxVelocityY = boxSpeed * 2;
                        break;
                    case 'dpadLeft':
                        boxVelocityX = -boxSpeed * 2;
                        break;
                    case 'dpadRight':
                        boxVelocityX = boxSpeed * 2;
                        break;
                    case 'l1':
                        boxSpeed = Math.max(1, boxSpeed - 1);
                        output.textContent += ` | Speed: ${boxSpeed}`;
                        break;
                    case 'r1':
                        boxSpeed = Math.min(10, boxSpeed + 1);
                        output.textContent += ` | Speed: ${boxSpeed}`;
                        break;
                    case 'psButton':
                        boxColor = '#0066cc';
                        boxSize = 50;
                        boxSpeed = 5;
                        boxRotation = 0;
                        boxVelocityX = 0;
                        boxVelocityY = 0;
                        output.textContent += ` | Reset to defaults`;
                        break;
                    case 'touchpad':
                        boxRotation = (boxRotation + 45) % 360;
                        break;
                }
                
                updateBoxPosition();
            });
            
            buttons[button].addEventListener('touchend', (e) => {
                e.preventDefault();
                buttons[button].style.transform = '';
                buttons[button].style.backgroundColor = '';
                output.textContent = `Button released: ${button.toUpperCase()}`;
                setTimeout(() => {
                    output.textContent = 'Touch and drag the left joystick to move';
                }, 1000);
            });
        });

        // Enhanced Joystick simulation for box control (mobile touch version)
        function setupMobileJoystick(joystick, name) {
            let touchId = null;
            const joystickRect = joystick.getBoundingClientRect();
            const centerX = joystickRect.left + joystickRect.width / 2;
            const centerY = joystickRect.top + joystickRect.height / 2;
            const maxDistance = joystickRect.width / 2;
            let moveX = 0;
            let moveY = 0;
            let lastMoveTime = 0;

            function updateJoystickPosition(touch) {
                const deltaX = touch.clientX - centerX;
                const deltaY = touch.clientY - centerY;
                
                // Calculate distance from center
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                const angle = Math.atan2(deltaY, deltaX);
                
                // Limit movement with smooth curve
                const normalizedDistance = Math.min(distance, maxDistance) / maxDistance;
                const easedDistance = normalizedDistance * normalizedDistance; // Quadratic easing
                const moveDistance = easedDistance * maxDistance;
                
                moveX = moveDistance * Math.cos(angle);
                moveY = moveDistance * Math.sin(angle);
                
                // Update joystick position with smooth transition
                joystick.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
                
                // Update output
                const xPercent = Math.round((moveX / maxDistance) * 100);
                const yPercent = Math.round((moveY / maxDistance) * 100);
                
                // Only control box with left joystick
                if (name === 'Left') {
                    // Calculate velocity based on joystick position
                    const now = performance.now();
                    const deltaTime = now - lastMoveTime;
                    lastMoveTime = now;
                    
                    // Apply acceleration for smoother movement
                    const targetVelocityX = (moveX / maxDistance) * boxSpeed * 2;
                    const targetVelocityY = (moveY / maxDistance) * boxSpeed * 2;
                    
                    // Smooth transition to target velocity
                    boxVelocityX += (targetVelocityX - boxVelocityX) * 0.2;
                    boxVelocityY += (targetVelocityY - boxVelocityY) * 0.2;
                }
                
                output.textContent = `${name} joystick: X=${xPercent}%, Y=${yPercent}% | Box: ${Math.round(boxX)}, ${Math.round(boxY)}`;
            }

            joystick.addEventListener('touchstart', (e) => {
                if (touchId === null) {
                    const touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    output.textContent = `${name} joystick engaged`;
                    updateJoystickPosition(touch);
                    e.preventDefault();
                }
            });

            document.addEventListener('touchmove', (e) => {
                if (touchId !== null) {
                    // Find our touch
                    let touch = null;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                    
                    if (touch) {
                        updateJoystickPosition(touch);
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                if (touchId !== null) {
                    // Find our touch
                    let touch = null;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                    
                    if (touch) {
                        touchId = null;
                        moveX = 0;
                        moveY = 0;
                        joystick.style.transform = 'translate(-50%, -50%)';
                        
                        // Smooth stop for left joystick
                        if (name === 'Left') {
                            boxVelocityX *= 0.5;
                            boxVelocityY *= 0.5;
                        }
                        
                        output.textContent = `${name} joystick released`;
                        setTimeout(() => {
                            output.textContent = 'Touch and drag the left joystick to move';
                        }, 1000);
                        e.preventDefault();
                    }
                }
            });
        }

        setupMobileJoystick(joystickLeft, 'Left');
        setupMobileJoystick(joystickRight, 'Right');
    </script>
</body>
</html>
