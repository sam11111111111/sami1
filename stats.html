<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Player Stats</title>
    <style>
     body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e2e;
            color: white;
            background-image: url('ps1.png');
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            margin: 0 auto;
            padding: 5px;
            background-color: #333;
            border-radius: 8px;
            background-image: url('ps.png');
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px; /* Reduced gap between player boxes */
        }

        .player-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px; /* Reduced padding */
            border-radius: 8px; /* Slightly smaller border radius */
            width: 40%; /* Reduce width to fit more players */
            box-sizing: border-box;
            margin-bottom: 5px; /* Reduced margin */
            text-align: left;
            font-size: 12px; /* Smaller font size */
        }

        button {
            padding: 5px; /* Reduced button padding */
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px; /* Reduced margin */
            font-size: 10px; /* Smaller font size */
        }

        .remove {
            background-color: #FF5722;
            color: white;
            border: none;
        }

        .lose {
            background-color: #FF5722;
            color: white;
            border: none;
        }

        .club-logo {
            width: 25px; /* Smaller logo size */
            height: 25px; /* Smaller logo size */
            margin-right: 5px; /* Reduced margin */
        }

        #menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 30px; /* Smaller menu font size */
            color: white;
        }

        /* Mobile Styles */
        @media screen and (max-width: 600px) {
            .player-box {
                width: 90%; /* Full width on small screens */
            }

            button {
                font-size: 10px;
                padding: 5px;
            }

            .club-logo {
                width: 20px; /* Even smaller logo size */
                height: 20px; /* Even smaller logo size */
            }

            .container {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
         <a href="register.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>



    <h2>🏆 ክለቦች 🏆</h2>
   
    <div id="playersContainer" class="container"></div>

       <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    
        const clubs = {
            "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
            "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
            "Liverpool_FC": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",



            "Manchester City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",
            "Aston Villa": "https://upload.wikimedia.org/wikipedia/en/9/9a/Aston_Villa_FC_new_crest.svg",

            "Borussia Dortmund": "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg",
            "Inter Milan": "FC_Internazionale_Milano_2021.svg",

            "AC Milan": "https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg",
            "Juventus": "https://upload.wikimedia.org/wikipedia/commons/d/da/Juventus_Logo.png",


            "Bayer Leverkusen": "Bayer_04_Leverkusen_logo.svg",  // Corrected the name and logo
            "Newcastle United": "https://upload.wikimedia.org/wikipedia/hif/2/25/Newcastle_United_Logo.png",  // Corrected club and logo
            
            "Atalanta": "AtalantaBC.svg",

            "Paris Saint-Germain FC": "wall/Paris_Saint-Germain_F.C.svg"


              // Corrected the name and logo
        };

          function updatePlayerStats() {
            let players = JSON.parse(localStorage.getItem("players")) || [];
            let playersContainer = document.getElementById("playersContainer");
            playersContainer.innerHTML = ""; // Clear the container before displaying updated data

            // Loop through each player and display their stats
            players.forEach((player, index) => {
                let playerDiv = document.createElement("div");
                playerDiv.classList.add("player-box");

                playerDiv.innerHTML = `
                    <h3 style="font-size: 14px; margin: 0;"><img src="${clubs[player.club]}" class="club-logo">${player.name} - ${player.club}</h3>
                    <p>💰 ተከፈለ: <span>${player.price}</span> ብር</p>
                    <p>❌ Losses: <span id="losses-${index}">${player.losses}</span></p>
                    <button class="lose" onclick="updateLoss(${index})">❌ Lose</button>
                    <button class="remove" onclick="removePlayer(${index})">🗑️ ቻው</button>
                `;
                playersContainer.appendChild(playerDiv);
            });
        }
//<button class="win" onclick="updateWin(${index})">✅ Win</button> 

     //   function updateWin(playerIndex) {
       //     let players = JSON.parse(localStorage.getItem("players")) || [];
         //   players[playerIndex].wins++;
           // localStorage.setItem("players", JSON.stringify(players));
            //updatePlayerStats();
        //}

        function updateLoss(playerIndex) {
            let players = JSON.parse(localStorage.getItem("players")) || [];
            players[playerIndex].losses++;
            localStorage.setItem("players", JSON.stringify(players));
            updatePlayerStats();
        }

        function removePlayer(playerIndex) {
            let players = JSON.parse(localStorage.getItem("players")) || [];
            players.splice(playerIndex, 1); // Remove the player at the given index
            localStorage.setItem("players", JSON.stringify(players));
            updatePlayerStats();
        }

        // Call updatePlayerStats to initialize and display the current player stats
        updatePlayerStats();
    </script>
</body>
</html>
