<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #1e1e2e;
            color: #ffffff;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .counter {
            background: #2a2a3b;
            padding: 20px;
            margin: 15px auto;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }
        h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        p {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            font-size: 16px;
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h2>🎮 PS Game Counter 🎮</h2>
    <div id="counters"></div>
    <script>
        const numPS5 = 3;
        const gamePrice = 7; // Price per game in birr
        const countersDiv = document.getElementById("counters");

        function createCounter(ps5Number) {
            let count = localStorage.getItem("ps5_" + ps5Number) || 0;
            let winsA = localStorage.getItem("ps5_" + ps5Number + "_A") || 0;
            let winsB = localStorage.getItem("ps5_" + ps5Number + "_B") || 0;
            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${ps5Number}</h3>
                <p>Games Played: <span id="count_${ps5Number}">${count}</span></p>
                <button class="increase" onclick="updateCount(${ps5Number}, 1)">+1 Game</button>
                <button class="reset" onclick="resetCount(${ps5Number})">Reset</button>
                <h3>🏆 Player Wins</h3>
                <p>Player A: <span id="winsA_${ps5Number}">${winsA}</span></p>
                <p>Player B: <span id="winsB_${ps5Number}">${winsB}</span></p>
                <button class="increase" onclick="updateWins(${ps5Number}, 'A', 1)">+1 A</button>
                <button class="increase" onclick="updateWins(${ps5Number}, 'B', 1)">+1 B</button>
                <button class="reset" onclick="resetWins(${ps5Number})">Reset Wins</button>
                <h3>💰 Total Price: <span id="totalPrice_${ps5Number}">${(count + parseInt(winsA) + parseInt(winsB)) * gamePrice}</span> Birr</h3>
            `;
            countersDiv.appendChild(counter);
        }

        function updateWins(ps5Number, player, change) {
            let wins = parseInt(localStorage.getItem("ps5_" + ps5Number + "_" + player) || 0);
            wins = Math.max(0, wins + change);
            localStorage.setItem("ps5_" + ps5Number + "_" + player, wins);
            document.getElementById("wins" + player + "_" + ps5Number).innerText = wins;
            updatePrice(ps5Number); // Update total price when wins change
        }

        function resetWins(ps5Number) {
            localStorage.setItem("ps5_" + ps5Number + "_A", 0);
            localStorage.setItem("ps5_" + ps5Number + "_B", 0);
            document.getElementById("winsA_" + ps5Number).innerText = 0;
            document.getElementById("winsB_" + ps5Number).innerText = 0;
            updatePrice(ps5Number); // Update total price when wins reset
        }

        function updateCount(ps5Number, change) {
            let count = parseInt(localStorage.getItem("ps5_" + ps5Number) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem("ps5_" + ps5Number, count);
            document.getElementById("count_" + ps5Number).innerText = count;
            updatePrice(ps5Number); // Update total price when game count changes
        }

        function resetCount(ps5Number) {
            localStorage.setItem("ps5_" + ps5Number, 0);
            document.getElementById("count_" + ps5Number).innerText = 0;
            updatePrice(ps5Number); // Update total price when game count reset
        }

        function updatePrice(ps5Number) {
            let count = parseInt(localStorage.getItem("ps5_" + ps5Number) || 0);
            let winsA = parseInt(localStorage.getItem("ps5_" + ps5Number + "_A") || 0);
            let winsB = parseInt(localStorage.getItem("ps5_" + ps5Number + "_B") || 0);
            let totalPrice = (count + winsA + winsB) * gamePrice;
            document.getElementById("totalPrice_" + ps5Number).innerText = totalPrice;
        }

        for (let i = 1; i <= numPS5; i++) {
            createCounter(i);
        }
    </script>
</body>
</html>
