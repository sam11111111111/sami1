<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #1e1e2e;
            color: #ffffff;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .counter {
            background: #2a2a3b;
            padding: 20px;
            margin: 15px auto;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }
        h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        p {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            font-size: 16px;
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h2>🎮 PS5 Game Counter 🎮</h2>
    <div id="counters"></div>
    <script>
        const numPS5 = 3;
        const countersDiv = document.getElementById("counters");
        
        function createCounter(ps5Number) {
            let count = localStorage.getItem("ps5_" + ps5Number) || 0;
            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS5 ${ps5Number}</h3>
                <p id="count_${ps5Number}">${count}</p>
                <button class="increase" onclick="updateCount(${ps5Number}, 1)">+1</button>
                <button class="decrease" onclick="updateCount(${ps5Number}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${ps5Number})">Reset</button>
            `;
            countersDiv.appendChild(counter);
        }

        function updateCount(ps5Number, change) {
            let count = parseInt(localStorage.getItem("ps5_" + ps5Number) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem("ps5_" + ps5Number, count);
            document.getElementById("count_" + ps5Number).innerText = count;
        }

        function resetCount(ps5Number) {
            localStorage.setItem("ps5_" + ps5Number, 0);
            document.getElementById("count_" + ps5Number).innerText = 0;
        }

        for (let i = 1; i <= numPS5; i++) {
            createCounter(i);
        }
    </script>
</body>
</html>
