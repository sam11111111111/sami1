<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Player Counter</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            color: black;
        }

        #playerName {
            padding: 8px;
            font-size: 14px;
            width: 60%;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 4px;
            margin: 5px;
        }

        #counters {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            /*width: 100%; */ 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #333; 
            border-radius: 8px; 
            background-image: url('ps.png');
            
        }
        



.counter {
    display: flex;
    flex-wrap: wrap; /* Allows wrapping on small screens */
    align-items: center;
    justify-content: center; /* Center elements */
   /* gap: 5px; /* Adds spacing */
    padding: 8px;
    margin: 6px;
    border-radius: 5px;
    font-size: 12px;
    background-color: #f9f9f9;
    border: 1px solid #000;
   /* width: 90%; /* Prevents overflow */
    max-width: 400px; /* Ensures it stays within screen */
    text-align: center;
}

.counter button {
    padding: 5px 10px;
    font-size: 12px;
}

.total-price {
    font-size: 12px;
    color: green;
}


       /* h3 { margin: 5px 0; font-size: 16px; }
        h2 { font-size: 14px; }

        span { font-weight: bold; font-size: 16px; }
*/
        
          .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset {
            background-color: #008CBA; 
            color: white; 



        }

        .remove-btn {
            color: red;
            cursor: pointer;
           
        }
        #si{
       position: fixed;
    top: 10px;
    right: 10px;
    font-size: 30px;
    color: whitesmoke;
}
    </style>
</head>
<body>
  <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    </script>

<a href="for_2.html" id="si"> <i class="bi bi-arrow-repeat"></i> </a>
<br>
    <h2 style="color: whitesmoke;">🎮 hየብቻ Jo ps መመዝገቢያ 🎮</h2>


    <input type="text" id="playerName" placeholder="የተጫዋች ስም">
    <button onclick="addPlayer()">➕ ጨምር</button>

<div id="counters"></div>
    <script>
        document.addEventListener("DOMContentLoaded", loadPlayers);

        let gamePrice = parseFloat(localStorage.getItem("gamePrice")) || 7; // Default price = 7 per game

        function addPlayer() {
            let name = document.getElementById("playerName").value.trim();
            if (name === "") {
                alert("❌ የተጫዋች ስም");
                return;
            }

            let players2 = JSON.parse(localStorage.getItem("players2")) || [];
            if (players2.some(player => player.name === name)) {
                alert("⚠️ ተጫዋቹ እኮ አለ!");
                return;
            }

            let newPlayer = { name, count: 0 };
            players2.push(newPlayer);
            localStorage.setItem("players2", JSON.stringify(players2));

            createCounter(newPlayer);
            document.getElementById("playerName").value = "";
        }

        function loadPlayers() {
            let players2 = JSON.parse(localStorage.getItem("players2")) || [];
            players2.forEach(createCounter);
        }
function createCounter(player) {
    let counter = document.createElement("div");
    counter.classList.add("counter");
    counter.id = `player_${player.name}`;

    counter.innerHTML = `
        <span class="total-price">🕹️ ${player.name}</span> |
        ጨዋታ: <span id="count_${player.name}">${player.count}</span> |
        <button onclick="updateCount('${player.name}', 1)" class="increase"> +1 </button>
        <button onclick="updateCount('${player.name}', -1)" class="decrease"> -1 </button>
        <button onclick="resetCount('${player.name}')" class="reset"> Reset </button> |
        💰 <span id="price_${player.name}" class="total-price">${player.count * gamePrice}</span> ብር |
        <button class="remove-btn" onclick="removePlayer('${player.name}')">🗑️</button> |
        <button onclick="addNote('${player.name}')">📌 Add Note</button>
        <p id="note_${player.name}" class="player-note">${player.note ? `📌 ${player.note}` : '📌 No Notes'}</p>
    `;

    document.getElementById("counters").appendChild(counter);
}


function addNote(playerName) {
    let note = prompt("Enter a note for " + playerName);
    if (note === null || note.trim() === "") return; // Cancel or empty note

    let players2 = JSON.parse(localStorage.getItem("players2")) || [];
    let playerIndex = players2.findIndex(p => p.name === playerName);
    if (playerIndex === -1) return;

    players2[playerIndex].note = note; // Save note to player object
    localStorage.setItem("players2", JSON.stringify(players2)); // Save updated players list

    document.getElementById(`note_${playerName}`).innerText = `📌 ${note}`; // Update UI
}

        function updateCount(playerName, change) {
            let players2 = JSON.parse(localStorage.getItem("players2")) || [];
            let player = players2.find(p => p.name === playerName);
            if (!player) return;

            player.count = Math.max(0, player.count + change);
            localStorage.setItem("players2", JSON.stringify(players2));

            document.getElementById(`count_${playerName}`).innerText = player.count;
            document.getElementById(`price_${playerName}`).innerText = player.count * gamePrice;
        }

        function resetCount(playerName) {
            let players2 = JSON.parse(localStorage.getItem("players2")) || [];
            let player = players2.find(p => p.name === playerName);
            if (!player) return;

            player.count = 0;
            localStorage.setItem("players2", JSON.stringify(players2));

            document.getElementById(`count_${playerName}`).innerText = 0;
            document.getElementById(`price_${playerName}`).innerText = 0;
        }

        function removePlayer(playerName) {
            let confirmDelete = confirm(`እርግጠኛ ነዎት ላስወግደው ${playerName}?`);
            if (!confirmDelete) return;

            let players2 = JSON.parse(localStorage.getItem("players2")) || [];
            players2 = players2.filter(p => p.name !== playerName);
            localStorage.setItem("players2", JSON.stringify(players2));

            document.getElementById(`player_${playerName}`).remove();
        }
    </script>

</body>
</html>
