<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
      
    <title>💸 Player Debt Tracking</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center;
            background-color: #222;
            color: white;
            background-repeat: no-repeat;
            background-size: cover;

             transition: background-color 0.3s, color 0.3s;
        }

            max-width: 400px;
            margin: 20px auto;

        }

        }

        }

        button {
            padding: 5px 10px;

        }

        .pay-btn { background-color: green; }
        .clear-btn { background-color: red; }

        #totalDebt {
            font-size: 18px;

        }

            margin-top: 20px;
        }

        #ad{
    background: rgba(0, 0, 0, 0.5);
    color: whitesmoke;
    font-weight: bold;
}
     #menu{
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 46px;
        color: white;
    }






/* Light mode styles */
body.light-mode {
    background-color: #f5f5f5;
    color: #333;
}

.light-mode .count p {
    background-color: #e0e0e0;
    color: #333;
}



.light-mode #lyew {
    background-color: #854836;
    color: #F6F0F0;
}

/* Theme toggle button */
#themeToggle {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 1000;
}

.light-mode #themeToggle {
    color: #333;

    </style>
</head>
<body>


  <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
    </script>

    <button id="themeToggle" style="position:fixed; top:5px; right:10px; padding:5px 10px; width: 15%;">
    <i class="bi bi-moon-fill"></i> <!-- Default dark mode icon -->
</button>

    <h2>💸 የተጫዋች ዕዳ  💸</h2>


  <a href="for_2.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>
      

    <input type="text" id="playerName12" placeholder="የተጫዋች ስም">
    <input type="number" id="debtAmount" placeholder="ዕዳ">
    <button onclick="addPlayer()" id="ad"> ➕ ተጫዋች ጨምር</button>

 <p id="totalDebt">📉 ጠቅላላ ዕዳ: 0 ብር</p>


    <div id="debtList"></div>

   

    <a href="for_2.html">⬅ ተመለስ</a>




     
<script type="text/javascript">
// Theme management
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.classList.toggle('light-mode', savedTheme === 'light');
    updateThemeIcon();
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    localStorage.setItem('theme', currentTheme);
    updateThemeIcon();
}

function updateThemeIcon() {
    const icon = document.querySelector('#themeToggle i');
    if (document.body.classList.contains('light-mode')) {
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
    } else {
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
    }
}

// Initialize theme and add event listener
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
});
</script>








    <script>
        document.addEventListener("DOMContentLoaded", loadDebts);

        function addPlayer() {
            let name = document.getElementById("playerName12").value.trim();
            let debt = parseFloat(document.getElementById("debtAmount").value) || 0;
            if (name === "") {
                alert("❌ Enter a player name!");
                return;
            }

            let players1 = JSON.parse(localStorage.getItem("players1")) || [];
           
            let newPlayer = { name, debt, paid: 0 };
            players1.push(newPlayer);
            localStorage.setItem("players1", JSON.stringify(players1));

            document.getElementById("playerName12").value = "";
            document.getElementById("debtAmount").value = "";
            loadDebts();
        }

        function loadDebts() {
            let players1 = JSON.parse(localStorage.getItem("players1")) || [];
            let debtList = document.getElementById("debtList");
            debtList.innerHTML = "";

            let totalDebt = 0;

            players1.forEach(player => {
                let remainingDebt = player.debt - (player.paid || 0);
                if (remainingDebt > 0) {
                    totalDebt += remainingDebt;

                    let div = document.createElement("div");
                    div.classList.add("player");

                    div.innerHTML = `
                        <strong>🕹️ ${player.name}</strong><br>
                        🔴 ጠቅላላ ዕዳ: <span id="debt_${player.name}">${player.debt}</span> ብር <br>
                        🟢 የተከፈለ: <span id="paid_${player.name}">${player.paid}</span> ብር <br>
                        📉 የቀረው: <span id="remaining_${player.name}">${remainingDebt}</span> ብር <br>
                        <button onclick="payDebt('${player.name}')" class="pay-btn">💵 ክፍያ</button>
                        <button onclick="clearDebt('${player.name}')" class="clear-btn">🗑️ ቻው</button>
                    `;

                    debtList.appendChild(div);
                }
            });

            document.getElementById("totalDebt").innerText = `📉 ጠቅላላ ዕዳ: ${totalDebt} ብር`;
        }

        function payDebt(playerName12) {
            let players1 = JSON.parse(localStorage.getItem("players1")) || [];
            let player = players1.find(p => p.name === playerName12);
            if (!player) return;

            let payment = parseFloat(prompt("Enter Payment Amount:")) || 0;
            player.paid = (player.paid || 0) + payment;

            localStorage.setItem("players1", JSON.stringify(players1));
            loadDebts();
        }

        function clearDebt(playerName12) {
            let players1 = JSON.parse(localStorage.getItem("players1")) || [];
            let player = players1.find(p => p.name === playerName12);
            if (!player) return;

            let confirmDelete = confirm(`እርግጠኛ ነዎት ማጽዳት ይፈልጋሉ ${player.name} ዕዳ?`);
            if (!confirmDelete) return;

            players1 = players1.filter(p => p.name !== playerName12);
            localStorage.setItem("players1", JSON.stringify(players1));

            loadDebts();
        }
    </script>

</body>
</html>
