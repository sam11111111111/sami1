<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Changer</title>
    <style>
        body {
            text-align: center;
            transition: background 0.5s ease;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .image-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .thumbnail {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .thumbnail:hover {
            transform: scale(1.1);
        }
        a {
            margin-top: 20px;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border-radius: 5px;
        }


.header {
  text-align: center;
  padding: 32px;
}

.row {
  display: -ms-flexbox; /* IE10 */
  display: flex;
  -ms-flex-wrap: wrap; /* IE10 */
  flex-wrap: wrap;
  padding: 0 4px;
}

/* Create four equal columns that sits next to each other */
.column {
  -ms-flex: 25%; /* IE10 */
  flex: 25%;
  max-width: 25%;
  padding: 0 4px;
}

.column img {
  margin-top: 8px;
  vertical-align: middle;
  width: 100%;
}

/* Responsive layout - makes a two column-layout instead of four columns */
@media screen and (max-width: 800px) {
  .column {
    -ms-flex: 50%;
    flex: 50%;
    max-width: 50%;
  }
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .column {
    -ms-flex: 100%;
    flex: 100%;
    max-width: 100%;
  }
}




    </style>
</head>
<body>
<div class="header">
    <h1>Choose a Background Image</h1>
    </div>

    <div class="image-container">


        <div class="row"> 
  <div class="column">
        <img src="images (1).jpg" class="thumbnail" onclick="changeBackground('images (1).jpg')">
        <img src="ps5.png" class="thumbnail" onclick="changeBackground('ps5.png')">
        <img src="ps6.png" class="thumbnail" onclick="changeBackground('ps6.png')">
        <img src="ps41.png" class="thumbnail" onclick="changeBackground('ps41.png')">
        <img src="/wall/wa1.png" class="thumbnail" onclick="changeBackground('/wall/wa1.png')">

</div>



<div class="column">


        <img src="ps5.png" class="thumbnail" onclick="changeBackground('ps5.png')">
        <img src="ps6.png" class="thumbnail" onclick="changeBackground('ps6.png')">
        <img src="ps41.png" class="thumbnail" onclick="changeBackground('ps41.png')">
        <img src="images.jpg" class="thumbnail" onclick="changeBackground('images.jpg')">
</div>

</div>


    </div>

    <a href="for_2.html">Apply and Back</a>

    <script>
        function changeBackground(imageUrl) {
            localStorage.setItem("bgImage", imageUrl);
            document.body.style.backgroundImage = `url(${imageUrl})`;
        }

        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") || 'https://source.unsplash.com/1920x1080?nature'})`;
    </script>

</body>
</html>
