<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Tournament Bracket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: white;
            background-image: url('ps1.png');
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 20px;
        }
        
        #menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 30px;
            color: white;
        }
        
        .tournament-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .bracket-container {
            display: flex;
            overflow-x: auto;
            padding: 20px;
            background: rgba(30,30,46,0.9);
            border-radius: 10px;
        }
        
        .round {
            margin: 0 15px;
            min-width: 250px;
        }
        
        .round h3 {
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        
        .match {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            position: relative;
        }
        
        .series-info {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .player-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        
        .player-name {
            flex-grow: 1;
            font-weight: bold;
            padding: 5px;
        }
        
        .score {
            width: 30px;
            text-align: center;
            margin: 0 5px;
            font-weight: bold;
        }
        
        .winner {
            background-color: rgba(76, 175, 80, 0.2);
            border-left: 3px solid #4CAF50;
        }
        
        .tie {
            background-color: rgba(255, 193, 7, 0.2);
            border-left: 3px solid #FFC107;
        }
        
        .tie-resolution {
            background: rgba(255,193,7,0.3);
            padding: 8px;
            margin-top: 10px;
            border-radius: 3px;
            text-align: center;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background: #FFB22C;
            color: #10375C;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        
        .delete-btn {
            background: #f44336;
            color: white;
        }
        
        .tiebreaker-btn {
            background: #FFC107;
            color: black;
        }
        
        .add-round-btn {
            background: #4CAF50;
            color: white;
        }
        
        .player-select {
            flex-grow: 1;
            padding: 5px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid #444;
            border-radius: 3px;
        }
        
        .round-complete {
            background: rgba(0,150,136,0.2);
            border-left: 3px solid #009688;
        }
    </style>
</head>
<body>
    <a href="tournament-view.html" id="menu"><i class="bi bi-arrow-left-short"></i></a>
    
    <div class="tournament-header">
        <h2 id="tournamentTitle">Tournament Bracket</h2>
        <p id="tournamentInfo"></p>
    </div>
    
    <div class="controls">
        <button onclick="completeTournament()">Complete Tournament</button>
        <button class="add-round-btn" onclick="addNewRound()">Add New Round</button>
        <button class="delete-btn" onclick="deleteTournament()">Delete Tournament</button>
    </div>
    
    <div id="bracketView" class="bracket-container">
        <!-- Bracket will be generated here -->
    </div>

    <script>
        // Load current tournament
        let tournamentIndex = localStorage.getItem("currentTournamentIndex");
        let tournaments = JSON.parse(localStorage.getItem("tournaments")) || [];
        let tournament = tournaments[tournamentIndex] || {
            name: "New Tournament",
            type: "single",
            game: "FIFA",
            bestOf: 3,
            players: [],
            rounds: [],
            status: "upcoming"
        };

        // Initialize tournament
        function initializeTournament() {
            if (!tournament.rounds || tournament.rounds.length === 0) {
                generateInitialRound();
            }
            updateTournamentInfo();
            generateBracket();
        }

        // Generate first round
        function generateInitialRound() {
            tournament.rounds = [];
            let matches = [];
            let players = tournament.players;
            
            // Create first round matches
            for (let i = 0; i < players.length; i += 2) {
                let match = createNewMatch();
                match.player1 = players[i];
                if (players[i+1]) match.player2 = players[i+1];
                matches.push(match);
            }
            
            // If no players, create two empty matches
            if (players.length === 0) {
                matches.push(createNewMatch());
                matches.push(createNewMatch());
            }
            
            tournament.rounds.push(matches);
            saveTournament();
        }

        // Create a new match object
        function createNewMatch() {
            return {
                player1: { name: "TBD" },
                player2: { name: "TBD" },
                score1: 0,
                score2: 0,
                player1Wins: 0,
                player2Wins: 0,
                winner: null,
                isTie: false,
                isTiebreaker: false,
                advanced: false
            };
        }

        // Update tournament info display
        function updateTournamentInfo() {
            document.getElementById("tournamentTitle").textContent = tournament.name;
            document.getElementById("tournamentInfo").textContent = 
                `${tournament.type === "single" ? "Single Elimination" : "Double Elimination"} | 
                Game: ${tournament.game} | 
                ${tournament.players.length} Players | 
                Status: ${tournament.status || "upcoming"}`;
        }

        // Generate the visual bracket
        function generateBracket() {
            const bracketDiv = document.getElementById("bracketView");
            bracketDiv.innerHTML = "";
            
            tournament.rounds.forEach((round, roundIndex) => {
                const roundDiv = document.createElement("div");
                roundDiv.className = `round ${isRoundComplete(roundIndex) ? 'round-complete' : ''}`;
                
                const roundTitle = document.createElement("h3");
                roundTitle.textContent = round[0]?.isTiebreaker ? "Tiebreaker Round" : "Round " + (roundIndex + 1);
                roundDiv.appendChild(roundTitle);
                
                round.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement("div");
                    matchDiv.className = `match ${match.isTie ? 'tie' : ''} ${match.winner ? 'winner' : ''}`;
                    
                    const player1Name = match.player1?.name || "TBD";
                    const player2Name = match.player2?.name || "TBD";
                    const isBye = match.player2?.isBye;
                    
                    matchDiv.innerHTML = `
                        <div class="series-info">
                            ${tournament.bestOf ? `Best of ${tournament.bestOf}` : 'Single match'}
                            ${match.isTiebreaker ? '<span style="color:#FFC107;">(Tiebreaker)</span>' : ''}
                            ${match.advanced ? '<span style="color:#4CAF50;">(Advanced)</span>' : ''}
                        </div>
                        
                        <div class="player-row ${match.winner === player1Name ? 'winner' : ''}">
                            <select class="player-select" onchange="updatePlayer(${roundIndex}, ${matchIndex}, 1, this.value)">
                                ${generatePlayerOptions(1, match.player1)}
                            </select>
                            <span class="score">${match.score1}</span>
                            <button onclick="addWin(${roundIndex}, ${matchIndex}, 1)">+</button>
                        </div>
                        
                        <div class="player-row ${match.winner === player2Name ? 'winner' : ''}">
                            <select class="player-select" onchange="updatePlayer(${roundIndex}, ${matchIndex}, 2, this.value)">
                                ${generatePlayerOptions(2, match.player2)}
                            </select>
                            <span class="score">${match.score2}</span>
                            <button ${isBye ? 'disabled' : ''} onclick="addWin(${roundIndex}, ${matchIndex}, 2)">+</button>
                        </div>
                        
                        ${match.isTie ? `
                        <div class="tie-resolution">
                            <p>Match Tied!</p>
                            <button class="tiebreaker-btn" onclick="createTiebreaker(${roundIndex}, ${matchIndex})">
                                Create Tiebreaker
                            </button>
                        </div>` : ''}
                        
                        ${match.winner ? `
                        <div style="text-align:center;margin-top:10px;color:#4CAF50;">
                            Winner: ${match.winner}
                        </div>` : ''}
                    `;
                    
                    roundDiv.appendChild(matchDiv);
                });
                
                // Add button to add matches to this round (only for last round)
                if (roundIndex === tournament.rounds.length - 1) {
                    const addMatchBtn = document.createElement("button");
                    addMatchBtn.className = "add-round-btn";
                    addMatchBtn.style.marginTop = "10px";
                    addMatchBtn.textContent = "+ Add Match to This Round";
                    addMatchBtn.onclick = () => addMatchToRound(roundIndex);
                    roundDiv.appendChild(addMatchBtn);
                }
                
                bracketDiv.appendChild(roundDiv);
            });
        }

        // Generate player options for dropdown
        function generatePlayerOptions(playerNum, currentPlayer) {
            let options = '<option value="">Select Player</option>';
            
            // Add BYE option only for player 2
            if (playerNum === 2) {
                options += `<option value="BYE" ${currentPlayer?.isBye ? 'selected' : ''}>BYE</option>`;
            }
            
            // Add all players
            tournament.players.forEach(player => {
                const selected = currentPlayer?.name === player.name ? 'selected' : '';
                options += `<option value="${player.name}" ${selected}>${player.name} (${player.club})</option>`;
            });
            
            // Add TBD option
            options += `<option value="TBD" ${(!currentPlayer || currentPlayer.name === "TBD") ? 'selected' : ''}>TBD</option>`;
            
            return options;
        }

        // Update player in a match
        function updatePlayer(roundIndex, matchIndex, playerNum, playerName) {
            const match = tournament.rounds[roundIndex][matchIndex];
            
            if (playerName === "BYE") {
                if (playerNum === 1) {
                    alert("Cannot set BYE as first player");
                    return;
                }
                match.player2 = { name: "BYE", isBye: true };
            } 
            else if (playerName === "TBD") {
                if (playerNum === 1) match.player1 = { name: "TBD" };
                else match.player2 = { name: "TBD" };
            }
            else {
                const player = tournament.players.find(p => p.name === playerName);
                if (player) {
                    if (playerNum === 1) match.player1 = player;
                    else match.player2 = player;
                }
            }
            
            // Reset match when players change
            match.score1 = 0;
            match.score2 = 0;
            match.player1Wins = 0;
            match.player2Wins = 0;
            match.winner = null;
            match.isTie = false;
            match.advanced = false;
            
            saveTournament();
            generateBracket();
        }

        // Add win to a player
        function addWin(roundIndex, matchIndex, playerNum) {
            const match = tournament.rounds[roundIndex][matchIndex];
            const winsNeeded = tournament.bestOf ? Math.ceil(tournament.bestOf/2) : 1;
            
            if (playerNum === 1) {
                match.player1Wins = (match.player1Wins || 0) + 1;
                match.score1 = (match.score1 || 0) + 1;
            } else {
                match.player2Wins = (match.player2Wins || 0) + 1;
                match.score2 = (match.score2 || 0) + 1;
            }
            
            // Check if match is complete
            checkMatchCompletion(roundIndex, matchIndex);
        }

        // Check if all matches in a round are complete
        function isRoundComplete(roundIndex) {
            const round = tournament.rounds[roundIndex];
            if (!round) return false;
            
            return round.every(match => {
                const winsNeeded = tournament.bestOf ? Math.ceil(tournament.bestOf/2) : 1;
                return match.winner || 
                       match.player2?.isBye ||
                       match.player1Wins >= winsNeeded || 
                       match.player2Wins >= winsNeeded ||
                       match.isTie;
            });
        }

        // Check if match is complete and handle progression
        function checkMatchCompletion(roundIndex, matchIndex) {
            const match = tournament.rounds[roundIndex][matchIndex];
            const winsNeeded = tournament.bestOf ? Math.ceil(tournament.bestOf/2) : 1;
            
            // Check for BYE automatic win
            if (match.player2?.isBye) {
                match.winner = match.player1.name;
                match.isTie = false;
            }
            // Check if either player has enough wins
            else if (match.player1Wins >= winsNeeded) {
                match.winner = match.player1.name;
                match.isTie = false;
            } 
            else if (match.player2Wins >= winsNeeded) {
                match.winner = match.player2.name;
                match.isTie = false;
            }
            // Check for tie
            else if (tournament.bestOf && (match.player1Wins + match.player2Wins) >= tournament.bestOf) {
                match.isTie = true;
                match.winner = null;
            }
            
            // If round is complete, advance winners
            if (isRoundComplete(roundIndex)) {
                tournament.rounds[roundIndex].forEach((match, idx) => {
                    if (match.winner && !match.advanced) {
                        advanceWinner(roundIndex, idx, match.winner);
                        match.advanced = true;
                    }
                });
            }
            
            saveTournament();
            generateBracket();
        }

        // Advance winner to next round
        function advanceWinner(roundIndex, matchIndex, winnerName) {
            // Don't advance from tiebreakers or if already advanced
            if (tournament.rounds[roundIndex][matchIndex].isTiebreaker || 
                tournament.rounds[roundIndex][matchIndex].advanced) {
                return;
            }
            
            const nextRoundIndex = roundIndex + 1;
            if (nextRoundIndex >= tournament.rounds.length) {
                addNewRound();
            }
            
            // Find position in next round
            const nextMatchIndex = Math.floor(matchIndex / 2);
            if (!tournament.rounds[nextRoundIndex]) {
                tournament.rounds[nextRoundIndex] = [];
            }
            if (!tournament.rounds[nextRoundIndex][nextMatchIndex]) {
                tournament.rounds[nextRoundIndex][nextMatchIndex] = createNewMatch();
            }
            
            // Assign winner to next match
            const winner = tournament.players.find(p => p.name === winnerName);
            const nextMatch = tournament.rounds[nextRoundIndex][nextMatchIndex];
            
            if (matchIndex % 2 === 0) {
                nextMatch.player1 = winner;
            } else {
                nextMatch.player2 = winner;
            }
            
            // Mark as advanced
            tournament.rounds[roundIndex][matchIndex].advanced = true;
        }

        // Create tiebreaker match
        function createTiebreaker(roundIndex, matchIndex) {
            const originalMatch = tournament.rounds[roundIndex][matchIndex];
            
            // Mark original match as having a tiebreaker
            originalMatch.hasTiebreaker = true;
            
            // Create new round if needed
            let nextRoundIndex = roundIndex + 1;
            if (nextRoundIndex >= tournament.rounds.length) {
                tournament.rounds.push([]);
            }
            
            // Create tiebreaker match
            const tiebreakerMatch = createNewMatch();
            tiebreakerMatch.player1 = originalMatch.player1;
            tiebreakerMatch.player2 = originalMatch.player2;
            tiebreakerMatch.isTiebreaker = true;
            tiebreakerMatch.originalRound = roundIndex;
            tiebreakerMatch.originalMatch = matchIndex;
            
            tournament.rounds[nextRoundIndex].push(tiebreakerMatch);
            
            saveTournament();
            generateBracket();
        }

        // Add new empty round
        function addNewRound() {
            tournament.rounds.push([]);
            saveTournament();
            generateBracket();
        }

        // Add match to specific round
        function addMatchToRound(roundIndex) {
            if (!tournament.rounds[roundIndex]) return;
            
            tournament.rounds[roundIndex].push(createNewMatch());
            saveTournament();
            generateBracket();
        }

        // Complete the tournament
        function completeTournament() {
            // Verify all matches have winners
            const incompleteMatches = tournament.rounds.flat().filter(m => 
                !m.winner && !m.player2?.isBye && !m.isTie
            );
            
            if (incompleteMatches.length > 0) {
                alert("Cannot complete tournament - there are unresolved matches!");
                return;
            }
            
            tournament.status = "completed";
            saveTournament();
            alert("Tournament completed successfully!");
            window.location.href = "tournament-view.html";
        }

        // Delete the entire tournament
        function deleteTournament() {
            if (confirm("Permanently delete this tournament?")) {
                tournaments.splice(tournamentIndex, 1);
                localStorage.setItem("tournaments", JSON.stringify(tournaments));
                window.location.href = "tournament-view.html";
            }
        }

        // Save tournament state
        function saveTournament() {
            if (tournamentIndex === null || tournamentIndex === undefined) {
                tournamentIndex = tournaments.length;
                tournaments.push(tournament);
            } else {
                tournaments[tournamentIndex] = tournament;
            }
            localStorage.setItem("tournaments", JSON.stringify(tournaments));
        }

        // Initialize the tournament view
        initializeTournament();
    </script>
</body>
</html>
