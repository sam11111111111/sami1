<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Tournament Bracket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: white;
            background-image: url('ps1.png');
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 20px;
        }
        
        #menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 30px;
            color: white;
        }
        
        .tournament-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .bracket-container {
            display: flex;
            overflow-x: auto;
            padding: 20px;
            background: rgba(30,30,46,0.9);
            border-radius: 10px;
        }
        
        .round {
            margin: 0 15px;
            min-width: 200px;
        }
        
        .round h3 {
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        
        .match {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        .player-name {
            font-weight: bold;
        }
        
        input[type="number"] {
            width: 40px;
            padding: 5px;
            margin: 0 5px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            text-align: center;
        }
        
        button {
            background: #FFB22C;
            color: #10375C;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .winner {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <a href="tournament-view.html" id="menu"><i class="bi bi-arrow-left-short"></i></a>
    
    <div class="tournament-header">
        <h2 id="tournamentTitle">Tournament Bracket</h2>
        <p id="tournamentInfo"></p>
    </div>
    
    <div class="controls">
        <button onclick="completeTournament()">Complete Tournament</button>
    </div>
    
    <div id="bracketView" class="bracket-container">
        <!-- Bracket will be generated here -->
    </div>

    <script>
        // Load current tournament
        const tournamentIndex = localStorage.getItem("currentTournamentIndex");
        let tournament = JSON.parse(localStorage.getItem("tournaments"))[tournamentIndex];
        
        // Initialize tournament rounds if not exists
        if (!tournament.rounds) {
            tournament.rounds = [];
            generateInitialBracket();
            saveTournament();
        }
        
        // Display tournament info
        document.getElementById("tournamentTitle").textContent = tournament.name;
        document.getElementById("tournamentInfo").textContent = 
            `${tournament.type === "single" ? "Single Elimination" : "Double Elimination"} | 
            ${tournament.players.length} Players | 
            ${new Date(tournament.date).toLocaleDateString()}`;
        
        // Generate initial bracket
        function generateInitialBracket() {
            const players = tournament.players;
            let matches = [];
            
            // Create first round matches
            for (let i = 0; i < players.length; i += 2) {
                const player2 = players[i+1] ? players[i+1] : {name: "BYE", isBye: true};
                matches.push({
                    player1: players[i],
                    player2: player2,
                    score1: 0,
                    score2: 0,
                    winner: null
                });
            }
            
            tournament.rounds = [matches];
        }
        
        // Generate visual bracket
        function generateBracket() {
            const bracketDiv = document.getElementById("bracketView");
            bracketDiv.innerHTML = "";
            
            tournament.rounds.forEach((round, roundIndex) => {
                const roundDiv = document.createElement("div");
                roundDiv.className = "round";
                roundDiv.innerHTML = `<h3>Round ${roundIndex + 1}</h3>`;
                
                round.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement("div");
                    matchDiv.className = "match";
                    
                    const player2Name = match.player2.isBye ? "BYE" : match.player2.name;
                    const isWinner1 = match.winner === match.player1.name;
                    const isWinner2 = match.winner === match.player2.name;
                    
                    matchDiv.innerHTML = `
                        <div class="player-name ${isWinner1 ? 'winner' : ''}">${match.player1.name}</div>
                        <input type="number" min="0" value="${match.score1}" 
                            onchange="updateScore(${roundIndex}, ${matchIndex}, 1, this.value)"
                            ${match.player2.isBye ? 'disabled' : ''}>
                        vs
                        <input type="number" min="0" value="${match.score2}" 
                            onchange="updateScore(${roundIndex}, ${matchIndex}, 2, this.value)"
                            ${match.player2.isBye ? 'disabled' : ''}>
                        <div class="player-name ${isWinner2 ? 'winner' : ''}">${player2Name}</div>
                        <button onclick="declareWinner(${roundIndex}, ${matchIndex})" 
                            ${match.player2.isBye || match.winner ? 'disabled' : ''}>
                            ${match.winner ? 'Completed' : 'Set Winner'}
                        </button>
                        ${match.player2.isBye ? '<div style="color:#aaa;font-size:12px;">Automatic Win</div>' : ''}
                    `;
                    roundDiv.appendChild(matchDiv);
                });
                
                bracketDiv.appendChild(roundDiv);
            });
        }
        
        // Update match scores
        function updateScore(roundIndex, matchIndex, playerNum, score) {
            const match = tournament.rounds[roundIndex][matchIndex];
            if (playerNum === 1) match.score1 = parseInt(score);
            else match.score2 = parseInt(score);
            saveTournament();
        }
        
        // Declare match winner
        function declareWinner(roundIndex, matchIndex) {
            const match = tournament.rounds[roundIndex][matchIndex];
            
            // Automatic win for BYE matches
            if (match.player2.isBye) {
                match.winner = match.player1.name;
            } else {
                match.winner = match.score1 > match.score2 ? match.player1.name : match.player2.name;
            }
            
            // If not final round, advance winner
            if (roundIndex < tournament.rounds.length - 1 || 
                tournament.type === 'double') {
                advanceWinner(roundIndex, matchIndex, match.winner);
            }
            
            saveTournament();
            generateBracket();
        }
        
        // Advance winner to next round
        function advanceWinner(roundIndex, matchIndex, winnerName) {
            const nextRoundIndex = roundIndex + 1;
            
            // Create next round if doesn't exist
            if (!tournament.rounds[nextRoundIndex]) {
                tournament.rounds[nextRoundIndex] = [];
            }
            
            // Find or create next match
            const nextMatchIndex = Math.floor(matchIndex / 2);
            if (!tournament.rounds[nextRoundIndex][nextMatchIndex]) {
                tournament.rounds[nextRoundIndex][nextMatchIndex] = {
                    player1: null,
                    player2: null,
                    score1: 0,
                    score2: 0,
                    winner: null
                };
            }
            
            // Assign winner to next match
            const nextMatch = tournament.rounds[nextRoundIndex][nextMatchIndex];
            const winner = tournament.players.find(p => p.name === winnerName);
            
            if (matchIndex % 2 === 0) {
                nextMatch.player1 = winner;
            } else {
                nextMatch.player2 = winner;
            }
        }
        
        // Complete tournament
        function completeTournament() {
            tournament.status = "completed";
            saveTournament();
            alert("Tournament marked as completed!");
            window.location.href = "tournament-view.html";
        }
        
        // Save tournament state
        function saveTournament() {
            const tournaments = JSON.parse(localStorage.getItem("tournaments"));
            tournaments[tournamentIndex] = tournament;
            localStorage.setItem("tournaments", JSON.stringify(tournaments));
        }
        
        // Initial bracket generation
        generateBracket();
    </script>
</body>
</html>
