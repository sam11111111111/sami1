<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <title>Register Player</title>
    <style>
        body {
         font-family: Arial, sans-serif;
         text-align: center;
         background-color: #1e1e2e; 
        color: white;
         
        background-repeat: no-repeat; 
        background-size: cover;
        height: 100hv;


        }
      

        input{padding: 10px; width: auto; margin: 10px 0; border-radius: 5px;}
        select, button { padding: 10px; width: 100%; margin: 10px 0; border-radius: 5px; }
        button { cursor: pointer; background-color: #FFB22C; color: #10375C; border: none; }
        .message { background-color: #B4E380; color: #343131; padding: 10px; margin-top: 20px; border-radius: 5px; }
        .count { margin-top: 20px; }
        #lyew{
            background-color: #F6F0F0;
            color: #854836;
        }
   
       p{
        font-size: 18px;
        background-color: #C7DB9C;
        color: #6C4E31;
        border-radius: 30px;
       }

     #menu{

    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 46px;

    color: white;
}
    </style>
</head>
<body>
      <a href="for_2.html" id="menu">  <i class="bi bi-arrow-left-short fs-1" ></i> </a>
<br>
    <h2>JO የተጫዋች መመዝገቢያ</h2>
   
        <form id="registerForm">
            <label for="playerName11">የተጫዋች ስም</label>
            <input type="text" id="playerName11" placeholder="ስሙ ማን ነው?" required>

<br>
            <label for="playerPrice">መላው (ብር)</label>
            <input type="number" id="playerPrice" placeholder="ብር ያስገቡ" min="1" required>

<br>
            <label for="club">ክለብ</label>
            <select id="club" required>
                <option value="" disabled selected>ክለብ ይምረጡ</option>
                <!-- Club options will be populated here dynamically -->
            </select>

            <button type="submit">መመዝገብ</button>
        </form>
        <a href="stats.html"> <button id="lyew"> ልየው </button> </a>

        <div id="message" class="message" style="display: none;"></div>

        <div class="count">
            <p><span id="playerCount">0</span> : ተጫዋች ተመዝግበዋል </p>
            <p>ጠቅላላ ብር: <span id="totalAmount"></span> ብር</p>
        </div>
    
      
   <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") })`;
  
     const clubs = {
             "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
            "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
            "Liverpool_FC": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",

             "Manchester United": "logo/Manchester_United_FC_crest.svg",

             "Manchester City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",
            "Aston Villa": "https://upload.wikimedia.org/wikipedia/en/9/9a/Aston_Villa_FC_new_crest.svg",

            "Borussia Dortmund": "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg",
            "Inter Milan": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",

            "AC Milan": "https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg",
            "Juventus": "https://upload.wikimedia.org/wikipedia/commons/d/da/Juventus_Logo.png",


            "Bayer Leverkusen": "logo/Bayer_04_Leverkusen_logo.svg",  // Corrected the name and logo
            "Newcastle United": "https://upload.wikimedia.org/wikipedia/hif/2/25/Newcastle_United_Logo.png",  // Corrected club and logo
            
            "Atalanta": "logo/AtalantaBC.svg",

            "Paris Saint-Germain FC": "wall/Paris_Saint-Germain_F.C.svg"
};

let players = JSON.parse(localStorage.getItem("players")) || [];

        function updateClubOptions() {
            const clubSelect = document.getElementById("club");
            clubSelect.innerHTML = '<option value="" disabled selected>ክለብ ምረጥ</option>';

            const registeredClubs = players.map(player => player.club);
            Object.keys(clubs).forEach(club => {
                if (!registeredClubs.includes(club)) {
                    const option = document.createElement("option");
                    option.value = club;
                    option.textContent = club;
                    clubSelect.appendChild(option);
                }
            });
        }

        function updatePlayerCount() {
            const playerCount = players.length;
            const totalAmount = players.reduce((sum, player) => sum + player.price, 0);
            document.getElementById("playerCount").innerText = playerCount;
            document.getElementById("totalAmount").innerText = totalAmount;
        }

        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const playerName11 = document.getElementById("playerName11").value;
            const club = document.getElementById("club").value;
            const playerPrice = parseFloat(document.getElementById("playerPrice").value);

            if (playerName11 && club && playerPrice > 0) {
                players.push({ name: playerName11, club: club, price: playerPrice, wins: 0, losses: 0 });

                localStorage.setItem("players", JSON.stringify(players));

                const message = document.getElementById("message");
                message.style.display = "block";
                message.innerText = `${playerName11} ለ ${club} ፈርሟል!`;

                document.getElementById("playerName11").value = "";
                document.getElementById("playerPrice").value = "";
                document.getElementById("club").value = "";

                updatePlayerCount();
                updateClubOptions();
            }
        });

        updateClubOptions();
        updatePlayerCount();
    </script>

</body>
</html>
