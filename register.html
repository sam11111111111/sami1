<script type="text/javascript">
// Theme management
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.classList.toggle('light-mode', savedTheme === 'light');
    updateThemeIcon();
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    localStorage.setItem('theme', currentTheme);
    updateThemeIcon();
}

function updateThemeIcon() {
    const icon = document.querySelector('#themeToggle i');
    if (document.body.classList.contains('light-mode')) {
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
    } else {
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
    }
}

// Initialize theme and add event listener
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
});
</script>

let players = JSON.parse(localStorage.getItem("players")) || [];

        function updateClubOptions() {
            const categorySelect = document.getElementById("category");
            const clubSelect = document.getElementById("club");
            const selectedCategory = categorySelect.value;
            
            clubSelect.innerHTML = '<option value="" disabled selected>ክለብ ምረጥ</option>';

            const registeredClubs = players.map(player => player.club);
            
            if (selectedCategory) {
                const categoryClubs = clubsByCategory[selectedCategory];
                Object.keys(categoryClubs).forEach(club => {
                    if (!registeredClubs.includes(club)) {
                        const option = document.createElement("option");
                        option.value = club;
                        option.textContent = club;
                        clubSelect.appendChild(option);
                    }
                });
            }
        }

        function updatePlayerCount() {
            const playerCount = players.length;
            const totalAmount = players.reduce((sum, player) => sum + player.price, 0);
            document.getElementById("playerCount").innerText = playerCount;
            document.getElementById("totalAmount").innerText = totalAmount;
        }

        document.getElementById("category").addEventListener("change", updateClubOptions);

        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const playerName11 = document.getElementById("playerName11").value;
            const club = document.getElementById("club").value;
            const playerPrice = parseFloat(document.getElementById("playerPrice").value);
            const category = document.getElementById("category").value;

            if (playerName11 && club && playerPrice > 0) {
                players.push({ name: playerName11, club: club, price: playerPrice, wins: 0, losses: 0 });

                localStorage.setItem("players", JSON.stringify(players));

                const message = document.getElementById("message");
                message.style.display = "block";
                message.innerText = `${playerName11} ለ ${club} ፈርሟል!`;

                // Clear only player name and price fields
                document.getElementById("playerName11").value = "";
                document.getElementById("playerPrice").value = "";
                
                // Keep the category selection and update club options
                document.getElementById("category").value = category;
                updateClubOptions();
                
                // Reset club selection
                document.getElementById("club").value = "";

                updatePlayerCount();
            }
        });

        updatePlayerCount();
