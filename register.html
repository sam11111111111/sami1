<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Player</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e2e; color: white; }
        .container { width: 300px; margin: 0 auto; padding: 20px; background-color: #333; border-radius: 8px; }
        label, input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🏆 Register Player</h2>
    <div class="container">
        <label for="playerName">Player Name</label>
        <input type="text" id="playerName" placeholder="Enter player name" required>

        <label for="clubSelect">Select Club</label>
        <select id="clubSelect" required>
            <option value="">-- Select a Club --</option>
            <option value="Barcelona">Barcelona</option>
            <option value="Real Madrid">Real Madrid</option>
            <option value="Manchester United">Manchester United</option>
            <option value="Chelsea">Chelsea</option>
            <option value="Bayern Munich">Bayern Munich</option>
        </select>

        <button onclick="registerPlayer()">Register Player</button>
       <a href="stats.html"> <button >View</button> </a>
    </div>

    <script>
        const clubs = {
            "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
            "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
            "Manchester United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
            "Chelsea": "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg",
            "Bayern Munich": "https://upload.wikimedia.org/wikipedia/en/1/1b/FC_Bayern_München_logo_%282017%29.svg"
        };

        function registerPlayer() {
            const playerName = document.getElementById("playerName").value;
            const club = document.getElementById("clubSelect").value;

            if (playerName && club) {
                let players = JSON.parse(localStorage.getItem("players")) || [];
                players.push({ name: playerName, club: club, wins: 0, losses: 0 });
                localStorage.setItem("players", JSON.stringify(players));

                // Remove the selected club from the dropdown
                let clubSelect = document.getElementById("clubSelect");
                for (let i = 0; i < clubSelect.options.length; i++) {
                    if (clubSelect.options[i].value === club) {
                        clubSelect.remove(i);
                        break;
                    }
                }

                alert("Player registered successfully!");
                window.location.href = "stats.html"; // Redirect to the stats page
            } else {
                alert("Please fill in both fields!");
            }
        }

        // Call this function to initialize the registration page with clubs that are not yet registered
        function initClubs() {
            const registeredClubs = JSON.parse(localStorage.getItem("players")) || [];
            const clubSelect = document.getElementById("clubSelect");

            // Get a list of registered clubs
            const registeredClubNames = registeredClubs.map(player => player.club);

            // Remove the registered clubs from the dropdown
            for (let i = clubSelect.options.length - 1; i >= 0; i--) {
                if (registeredClubNames.includes(clubSelect.options[i].value)) {
                    clubSelect.remove(i);
                }
            }
        }

        // Initialize the clubs options when the page loads
        initClubs();
    </script>
</body>
</html>
