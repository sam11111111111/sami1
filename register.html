<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <title>Register Player</title>
    <style>
        body {
         font-family: Arial, sans-serif;
         text-align: center;
         background-color: #1e1e2e; 
        color: white;
          background-image: url(ps3.png);
        background-repeat: no-repeat; 
        background-size: cover;


        }
        .container { width: 300px; margin: 0 auto; padding: 20px; background-color: #333; border-radius: 8px; 

  background-image: url(ps3.png);
        background-repeat: no-repeat; 
        background-size: cover;
        }

        input{padding: 10px; width: auto; margin: 10px 0; border-radius: 5px;}
        select, button { padding: 10px; width: 100%; margin: 10px 0; border-radius: 5px; }
        button { cursor: pointer; background-color: #FFB22C; color: #10375C; border: none; }
        .message { background-color: #B4E380; color: #343131; padding: 10px; margin-top: 20px; border-radius: 5px; }
        .count { margin-top: 20px; }
        #lyew{
            background-color: #F6F0F0;
            color: #854836;
        }
        #ll{
            color: #FBF8EF;

           font-size: 33px;  
       }
       p{
        font-size: 23px;
        background-color: #C7DB9C;
        color: #6C4E31;
        border-radius: 30px;
       }


    </style>
</head>
<body>
    <h2>JO የተጫዋች መመዝገቢያ</h2>
    <div class="container">
        <form id="registerForm">
            <label for="playerName">የተጫዋች ስም</label>
            <input type="text" id="playerName" placeholder="ስሙ ማን ነው?" required>

            <label for="club">ክለብ</label>
            <select id="club" required>
                <option value="" disabled selected>ክለብ ይምረጡ</option>
                <!-- Club options will be populated here dynamically -->
            </select>

            <button type="submit">ትመዘገባለህ</button>
        </form>
        <a href="stats.html"> <button id="lyew"> ልየው </button> </a>

        <div id="message" class="message" style="display: none;"></div>

        <div class="count">
            <p><span id="playerCount">0</span> : ተጫዋቾች ተመዝግበዋል </p>
            <p>ጠቅላላ ብር: <span id="totalAmount">0</span> ብር</p>
        </div>
    
        <a href="for_2.html"><i class="bi bi-skip-backward" id="ll"></i></a>
    </div>

    <script>
     const clubs = {
             "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
            "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
            "Liverpool_FC": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",

            "Manchester City": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
            

            "Aston Villa": "https://upload.wikimedia.org/wikipedia/en/4/47/Aston_Villa_FC_crest.svg",
            "Borussia Dortmund": "https://upload.wikimedia.org/wikipedia/commons/0/02/Borussia_Dortmund_logo.svg",

            "Inter Milan": "https://upload.wikimedia.org/wikipedia/commons/0/0f/Inter_Milan_2021_logo.svg",

            "AC Milan": "https://upload.wikimedia.org/wikipedia/commons/0/0a/AC_Milan_logo.svg",
            "Juventus": "https://upload.wikimedia.org/wikipedia/commons/5/5d/Juventus_FC_2017_logo.svg",




            "Bayer": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
            
            "newcastle": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",

            "Atlanta": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",
};


        let players = JSON.parse(localStorage.getItem("players")) || [];

        // Function to update the club options based on already registered players
        function updateClubOptions() {
            const clubSelect = document.getElementById("club");
            clubSelect.innerHTML = '<option value="" disabled selected>ክለብ ምረጥ</option>'; // Reset options

            // Get clubs that have not been registered yet
            const registeredClubs = players.map(player => player.club);
            Object.keys(clubs).forEach(club => {
                if (!registeredClubs.includes(club)) {
                    const option = document.createElement("option");
                    option.value = club;
                    option.textContent = club;
                    clubSelect.appendChild(option);
                }
            });
        }

        function updatePlayerCount() {
            const playerCount = players.length;
            const totalAmount = playerCount * 100;
            document.getElementById("playerCount").innerText = playerCount;
            document.getElementById("totalAmount").innerText = totalAmount;
        }

        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const playerName = document.getElementById("playerName").value;
            const club = document.getElementById("club").value;

            if (playerName && club) {
                // Add new player to the players array
                players.push({ name: playerName, club: club, wins: 0, losses: 0 });

                // Save players to localStorage
                localStorage.setItem("players", JSON.stringify(players));

                // Show success message
                const message = document.getElementById("message");
                message.style.display = "block";
                message.innerText = `${playerName} ለ ${club} ፈርሟል!`;

                // Clear the form fields
                document.getElementById("playerName").value = "";
                document.getElementById("club").value = "";

                // Update player count and total amount
                updatePlayerCount();

                // Update the club options (hide the selected club)
                updateClubOptions();
            }
        });

        // Initialize the page with current club options and player count
        updateClubOptions();
        updatePlayerCount();
    </script>
</body>
</html>
