<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Player</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e2e; color: white; }
        .container { width: 300px; margin: 0 auto; padding: 20px; background-color: #333; border-radius: 8px; }
        input, select, button { padding: 10px; width: 100%; margin: 10px 0; border-radius: 5px; }
        button { cursor: pointer; background-color: #007BFF; color: white; border: none; }
        .message { background-color: #ff5722; color: white; padding: 10px; margin-top: 20px; border-radius: 5px; }
        .count { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>JO የተጫዋች መመዝገቢያ</h2>
    <div class="container">
        <form id="registerForm">
            <label for="playerName">የተጫዋች ስም</label>
            <input type="text" id="playerName" required>

            <label for="club">ክለብ</label>
            <select id="club" required>
                <option value="" disabled selected>ክለብ ይምረጡ</option>
                <!-- Club options will be populated here dynamically -->
            </select>

            <button type="submit">ትመዘገባለህ</button>
        </form>
        <a href="stats.html"> <button> ልየው </button> </a>

        <div id="message" class="message" style="display: none;"></div>

        <div class="count">
            <p><span id="playerCount">0</span> : ተጫዋቾች ተመዝግበዋል </p>
            <p>ጠቅላላ ብር: <span id="totalAmount">0</span> ብር</p>
        </div>
    </div>

    <script>
        const clubs = {
            "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
            "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
            "Manchester United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
            "Chelsea": "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg",
            "Bayern Munich": "https://upload.wikimedia.org/wikipedia/en/1/1b/FC_Bayern_München_logo_%282017%29.svg"
        };

        let players = JSON.parse(localStorage.getItem("players")) || [];

        // Function to update the club options based on already registered players
        function updateClubOptions() {
            const clubSelect = document.getElementById("club");
            clubSelect.innerHTML = '<option value="" disabled selected>Select Club</option>'; // Reset options

            // Get clubs that have not been registered yet
            const registeredClubs = players.map(player => player.club);
            Object.keys(clubs).forEach(club => {
                if (!registeredClubs.includes(club)) {
                    const option = document.createElement("option");
                    option.value = club;
                    option.textContent = club;
                    clubSelect.appendChild(option);
                }
            });
        }

        function updatePlayerCount() {
            const playerCount = players.length;
            const totalAmount = playerCount * 100;
            document.getElementById("playerCount").innerText = playerCount;
            document.getElementById("totalAmount").innerText = totalAmount;
        }

        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const playerName = document.getElementById("playerName").value;
            const club = document.getElementById("club").value;

            if (playerName && club) {
                // Add new player to the players array
                players.push({ name: playerName, club: club, wins: 0, losses: 0 });

                // Save players to localStorage
                localStorage.setItem("players", JSON.stringify(players));

                // Show success message
                const message = document.getElementById("message");
                message.style.display = "block";
                message.innerText = `Player ${playerName} from ${club} has been registered successfully!`;

                // Clear the form fields
                document.getElementById("playerName").value = "";
                document.getElementById("club").value = "";

                // Update player count and total amount
                updatePlayerCount();

                // Update the club options (hide the selected club)
                updateClubOptions();
            }
        });

        // Initialize the page with current club options and player count
        updateClubOptions();
        updatePlayerCount();
    </script>
</body>
</html>
