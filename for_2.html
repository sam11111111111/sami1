<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #1e1e2e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden; /* Prevent scrolling */
            padding: 10px;
        }

        /* Header */
        h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* Container for counters */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 800px;
            padding: 10px;
        }

        /* Counter box */
        .counter {
            background: rgba(42, 42, 59, 0.8);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 160px;
        }

        /* Bottom section for totals */
        .bottom-section {
            width: 100%;
            max-width: 400px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .total-revenue, .total-games {
            background: #ff9800;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }

        /* Buttons */
        button {
            font-size: 12px;
            padding: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }

    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>

    <div class="container" id="counters"></div>

    <div class="bottom-section">
        <div class="total-box">
            <div class="total-revenue">
                💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> Birr
            </div>
            <div class="total-games">
                🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span>
            </div>
        </div>
    </div>

    <script>
        const numPS = 3;
        const gamePrice = 7;
        const countersDiv = document.getElementById("counters");

        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${psNumber}</h3>
                <p>ጨዋታ: <span id="count_${psNumber}">${count}</span></p>
                <button class="increase" onclick="updateCount(${psNumber}, 1)"> +1</button>
                <button class="decrease" onclick="updateCount(${psNumber}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${psNumber})">Reset</button>
                <p>💰 <span id="totalPrice_${psNumber}">${count * gamePrice}</span> Birr</p>
            `;

            countersDiv.appendChild(counter);
        }

        function updateCount(psNumber, change) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem(`ps_${psNumber}_games`, count);
            document.getElementById(`count_${psNumber}`).innerText = count;
            document.getElementById(`totalPrice_${psNumber}`).innerText = count * gamePrice;
            updateTotalRevenue();
        }

        function resetCount(psNumber) {
            localStorage.setItem(`ps_${psNumber}_games`, 0);
            document.getElementById(`count_${psNumber}`).innerText = 0;
            document.getElementById(`totalPrice_${psNumber}`).innerText = 0;
            updateTotalRevenue();
        }

        function updateTotalRevenue() {
            let totalGamesPlayed = 0;
            let totalRevenue = 0;

            for (let i = 1; i <= numPS; i++) {
                let count = parseInt(localStorage.getItem(`ps_${i}_games`) || 0);
                totalGamesPlayed += count;
                totalRevenue += count * gamePrice;
            }

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        for (let i = 1; i <= numPS; i++) {
            createCounter(i);
        }

        updateTotalRevenue();
    </script>
</body>
</html>
