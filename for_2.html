<script type="text/javascript">
// Theme management
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.classList.toggle('light-mode', savedTheme === 'light');
    updateThemeIcon();
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    localStorage.setItem('theme', currentTheme);
    updateThemeIcon();
}

function updateThemeIcon() {
    const icon = document.querySelector('#themeToggle i');
    if (document.body.classList.contains('light-mode')) {
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
    } else {
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
    }
}

// Initialize theme and add event listener
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
});
</script>















<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
}



    window.addEventListener("resize", () => {

});
 
// Retrieve settings from localStorage
let gamePrice = parseFloat(localStorage.getItem("gamePrice")) || 7;
let timerDuration = parseInt(localStorage.getItem("timerDuration")) || 5;
let savingPercentage = parseInt(localStorage.getItem("savingPercentage")) || 20;

let numPS = parseInt(localStorage.getItem("numPS")) || 3;

// Ensure UI reflects the stored values
document.addEventListener("DOMContentLoaded", function () {
           // let numPS = parseInt(localStorage.getItem("numPS")) || 3; // Default: 3 counters
            const countersDiv = document.getElementById("counters");
            countersDiv.innerHTML = ""; // Clear previous counters

            for (let i = 1; i <= numPS; i++) {
                createCounter(i);
            }
        });


   //  let numPS = 3;
    //const gamePrice = 7;
    const adminPIN = "1234";
    let timers = {};

    const countersDiv = document.getElementById("counters");

    let totalGamesPlayed = parseInt(localStorage.getItem("totalGamesPlayed")) || 0;
    let totalRevenue = parseInt(localStorage.getItem("totalRevenue")) || 0;


        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            let gamePrice = parseFloat(localStorage.getItem("gamePrice")) || 7;

            const counter = document.createElement("div");
               counter.classList.add("counter");
        counter.innerHTML = `
            <h3>🕹️ PS ${psNumber}</h3>
            <h2>ጨዋታ:</h2> <span id="count_${psNumber}">${count}</span>
            <button class="increase" id="increase" onclick="updateCount(${psNumber}, 1)"> +1 </button><br>
            <button class="decrease" id="decrease" onclick="updateCount(${psNumber}, -1)"> -1 </button><br>
            <button class="reset" onclick="resetCount(${psNumber})"> Reset </button>
            <h4>💰 PS ${psNumber}: <span id="totalPrice_${psNumber}">${count * gamePrice}</span> ብር</h4>

            <div class="tim" >
            <h4>⏱️  <span id="timer_${psNumber}">00:00</span></h4>
            <button class="timer" onclick="startTimer(${psNumber})">⏳</button>
            <button class="stop-timer timer" onclick="stopTimer(${psNumber})">⏹</button>
            <button class="reset-timer timer" onclick="resetTimer(${psNumber})">🔄</button>
            </div>
        `;

        countersDiv.appendChild(counter);
    }

function startTimer(psNumber) {
    if (timers[psNumber]) return;

    let timeLeft = timerDuration * 60; // Convert minutes to seconds
    let timerDisplay = document.getElementById(`timer_${psNumber}`);

    timers[psNumber] = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timers[psNumber]);
            timers[psNumber] = null;
            if (navigator.vibrate) navigator.vibrate(1500);
            setTimeout(() => {
                alert(`⏳ Time's up for PS ${psNumber}!`);
            }, 1200);
            return;
        }
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        timeLeft--;
    }, 1200);
}

function resetTimer(psNumber) {
    stopTimer(psNumber);
    localStorage.setItem(`timer_${psNumber}`, 300);
    document.getElementById(`timer_${psNumber}`).innerText = "00:00";
}


    function stopTimer(psNumber) {
        clearInterval(timers[psNumber]);
        timers[psNumber] = null;
    }



   
function updateCount(psNumber, change) {
    let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
    count = Math.max(0, count + change);
    localStorage.setItem(`ps_${psNumber}_games`, count);
    document.getElementById(`count_${psNumber}`).innerText = count;

    let totalPrice = count * gamePrice;
    document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;

    totalGamesPlayed += (change === 1 ? 1 : 0);
    totalRevenue += (change === 1 ? gamePrice : 0);

    localStorage.setItem("totalGamesPlayed", totalGamesPlayed);
    localStorage.setItem("totalRevenue", totalRevenue);

    updateTotalRevenue();
}




    function resetCount(psNumber) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
        localStorage.setItem(`ps_${psNumber}_games`, 0);
        document.getElementById(`count_${psNumber}`).innerText = 0;
        updatePrice(psNumber, count, 0);
    }


    function updatePrice(psNumber, oldCount, count) {
        let totalPrice = count * gamePrice;
        document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;
    }

    function confirmReset() {
        let userPIN = prompt("🔐 Enter Admin PIN to Reset:");
        if (userPIN === adminPIN) {
            resetAll();
            alert("✅ All data has been reset!");
        } else {
            alert("❌ Incorrect PIN! Reset Canceled.");
        }
    }

    function resetAll() {
        
        for (let i = 1; i <= numPS; i++) {

            localStorage.setItem(`ps_${i}_games`, 0);
            document.getElementById(`count_${i}`).innerText = 0;
            document.getElementById(`totalPrice_${i}`).innerText = 0;
        }

        totalGamesPlayed = 0;
        totalRevenue = 0;
        localStorage.setItem("totalGamesPlayed", totalGamesPlayed);
        localStorage.setItem("totalRevenue", totalRevenue);

        document.getElementById("totalGames").innerText = totalGamesPlayed;
        document.getElementById("totalRevenue").innerText = totalRevenue;
        document.getElementById("per").innerText = 0;
    }

    for (let i = 1; i <= numPS; i++) {
        createCounter(i);
    }

    updateTotalRevenue();

function updateTotalRevenue() {
    totalGamesPlayed = parseInt(localStorage.getItem("totalGamesPlayed")) || 0;
    totalRevenue = parseInt(localStorage.getItem("totalRevenue")) || 0;

    let savings = (totalRevenue * savingPercentage) / 100;

    document.getElementById("totalGames").innerText = totalGamesPlayed;
    document.getElementById("totalRevenue").innerText = totalRevenue;
    document.getElementById("per").innerText = savings;
} 

</script>
