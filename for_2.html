<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            background-image: url('ps42.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
        }

        h2 {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1500px;
            padding: 10px;
            margin-top: 20px;
        }

        .counter {
            padding: 15px;
            border-radius: 15px;
            width: 180px;
            height: 230px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: fixed;
            bottom: 10px;
        }

        .total-box {
            display: flex;
            flex-direction: column-reverse;
            gap: 0px;
            justify-content: center;
        }

        .total-revenue, .total-games, .perr {
            background: #EFDCAB;
            padding: 4px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            width: 180px;
            margin: 5px;
            text-align: center;
        }

        button {
            font-size: 14px;
            padding: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        .reset-bottom {
            width: 180px;
            margin-top: 10px;
        }

        .graph-container {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>

    <div class="container" id="counters"></div>

    <div class="bottom-section">
        <div class="total-box">
            <div class="total-revenue">
                💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> ብር
            </div>
            <div class="total-games">
                🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span>
            </div>
            <div class="perr"> 
                🏦 ቁጠባ: <span id="per">0</span> ብር
            </div>
        </div>
        <button class="reset reset-bottom" onclick="confirmReset()">Reset All</button>
    </div>

    <div class="graph-container">
        <canvas id="revenueChart"></canvas>
    </div>

    <script>
        const numPS = 3;
        const gamePrice = 7;
        const adminPIN = "1234";

        const countersDiv = document.getElementById("counters");
        let totalGamesPlayed = 0;
        let totalRevenue = 0;

        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${psNumber}</h3>
                <h2>ጨዋታ:</h2> <span id="count_${psNumber}">${count}</span></p>
                <button class="increase" onclick="updateCount(${psNumber}, 1)"> +1</button><br>
                <button class="decrease" onclick="updateCount(${psNumber}, -1)">-1</button><br>
                <button class="reset" onclick="resetCount(${psNumber})">Reset</button>
                <h4>💰 PS ${psNumber}: <span id="totalPrice_${psNumber}">${count * gamePrice}</span> ብር</h4>
            `;

            countersDiv.appendChild(counter);
        }

        function updateCount(psNumber, change) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem(`ps_${psNumber}_games`, count);
            document.getElementById(`count_${psNumber}`).innerText = count;

            totalGamesPlayed += change;
            totalRevenue += change * gamePrice;

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
            saveDailyStats();
        }

        function saveDailyStats() {
            let today = new Date().toISOString().split("T")[0];
            let dailyStats = JSON.parse(localStorage.getItem("dailyStats")) || {};
            dailyStats[today] = { games: totalGamesPlayed, revenue: totalRevenue };
            localStorage.setItem("dailyStats", JSON.stringify(dailyStats));
            updateChart();
        }

        function resetDailyStats() {
            let today = new Date().toISOString().split("T")[0];
            let lastReset = localStorage.getItem("lastResetDate");

            if (lastReset !== today) {
                localStorage.setItem("lastResetDate", today);
                for (let i = 1; i <= numPS; i++) {
                    localStorage.setItem(`ps_${i}_games`, 0);
                }
                totalGamesPlayed = 0;
                totalRevenue = 0;
                document.getElementById("totalGames").innerText = totalGamesPlayed;
                document.getElementById("totalRevenue").innerText = totalRevenue;
            }
        }

        function updateChart() {
            let dailyStats = JSON.parse(localStorage.getItem("dailyStats")) || {};
            let labels = Object.keys(dailyStats);
            let revenues = labels.map(date => dailyStats[date].revenue);

            new Chart(document.getElementById("revenueChart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{ label: "Daily Revenue", data: revenues, borderColor: "orange", fill: false }]
                }
            });
        }

        for (let i = 1; i <= numPS; i++) {
            createCounter(i);
        }

        resetDailyStats();
        updateChart();
    </script>
</body>
</html>
