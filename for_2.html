<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            background-image: url('ps5.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
        }

        h2 {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1500px;
            padding: 10px;
            margin-top: 20px;
        }

        .counter {
            padding: 15px;
            border-radius: 15px;
            width: 180px;
            height: 250px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: fixed;
            bottom: 10px;
        }

        .total-box {
            display: flex;
            flex-direction: column-reverse;
            gap: 0px;
            justify-content: center;
        }

        .total-revenue, .total-games, .perr {
            background: #ff9800;
            padding: 4px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            width: 180px;
            margin: 5px;
            text-align: center;
        }

        button {
            font-size: 14px;
            padding: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        .timer { background-color: #FFC107; color: black; font-weight: bold; }

        .reset-bottom {
            width: 180px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>

    <div class="container" id="counters"></div>

    <div class="bottom-section">
        <div class="total-box">
            <div class="total-revenue">
                💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> ብር
            </div>
            <div class="total-games">
                🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span>
            </div>
            <div class="perr"> 
                🏦 ቁጠባ: <span id="per">0</span> ብር
            </div>
        </div>
        <button class="reset reset-bottom" onclick="confirmReset()">Reset All</button>
    </div>

<script>
    const numPS = 3;
    const gamePrice = 7;
    const adminPIN = "1234";

    const countersDiv = document.getElementById("counters");

    let totalGamesPlayed = parseInt(localStorage.getItem("totalGamesPlayed")) || 0;
    let totalRevenue = parseInt(localStorage.getItem("totalRevenue")) || 0;

    function createCounter(psNumber) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

        const counter = document.createElement("div");
        counter.classList.add("counter");
        counter.innerHTML = `
            <h3>🕹️ PS ${psNumber}</h3>
            <h2>ጨዋታ:</h2> <span id="count_${psNumber}">${count}</span>
            <button class="increase" onclick="updateCount(${psNumber}, 1)"> +1 </button><br>
            <button class="decrease" onclick="updateCount(${psNumber}, -1)"> -1 </button><br>
            <button class="reset" onclick="resetCount(${psNumber})"> Reset </button>
            <h4>💰 PS ${psNumber}: <span id="totalPrice_${psNumber}">${count * gamePrice}</span> Birr</h4>
            <button class="timer" onclick="startTimer(${psNumber})">⏳ Start Timer</button>
            <h4>⏱️ Time: <span id="timer_${psNumber}">00:00</span></h4>
        `;

        countersDiv.appendChild(counter);
    }

    function startTimer(psNumber) {
        let timeLeft = 300;  
        let timerDisplay = document.getElementById(`timer_${psNumber}`);

        let timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            if (timeLeft === 0) {
                clearInterval(timerInterval);
                alert(`⏳ Time's up for PS ${psNumber}!`);
                if (navigator.vibrate) {
                    navigator.vibrate([500, 300, 500]);  
                }
            }
            timeLeft--;
        }, 1000);
    }

    function updateCount(psNumber, change) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
        count = Math.max(0, count + change);
        localStorage.setItem(`ps_${psNumber}_games`, count);
        document.getElementById(`count_${psNumber}`).innerText = count;

        document.getElementById(`totalPrice_${psNumber}`).innerText = count * gamePrice;
        totalGamesPlayed += (change === 1 ? 1 : 0);
        totalRevenue += (change === 1 ? gamePrice : 0);

        localStorage.setItem("totalGamesPlayed", totalGamesPlayed);
        localStorage.setItem("totalRevenue", totalRevenue);

        document.getElementById("totalGames").innerText = totalGamesPlayed;
        document.getElementById("totalRevenue").innerText = totalRevenue;
        document.getElementById("per").innerText = (totalRevenue * 20) / 100;
    }

    for (let i = 1; i <= numPS; i++) {
        createCounter(i);
    }
</script>

</body>
</html>
