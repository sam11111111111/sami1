<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            gap: 10px;
            flex-grow: 1;
            margin-bottom: 20px;
        }
        .counter {
            background: #2a2a3b;
            padding: 10px;
            border-radius: 10px;
            width: 120px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
            box-sizing: border-box;
        }
        button {
            font-size: 10px;
            padding: 5px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        .total-revenue, .total-games {
            background: #ff9800;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }
        @media (max-width: 600px) {
            h2 {
                font-size: 16px;
            }
            .counter {
                width: 100px;
                font-size: 10px;
                height: 150px;
            }
            .total-revenue, .total-games {
                font-size: 12px;
                width: 90%;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>
    <div class="container" id="counters"></div>

    <div class="total-revenue">
        💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> Birr
    </div>
    <div class="total-games">
        🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span> ጨዋታዎች
    </div>

    <button class="reset" onclick="resetAll()">Reset All</button>

    <script>
        const numPS = 3;
        const gamePrice = 7;
        const countersDiv = document.getElementById("counters");

        let totalGamesPlayed = 0;
        let totalRevenue = 0;

        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${psNumber}</h3>
                <p>ጨዋታ: <span id="count_${psNumber}">${count}</span></p>
                <button class="increase" onclick="updateCount(${psNumber}, 1)">+1</button>
                <button class="decrease" onclick="updateCount(${psNumber}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${psNumber})">Reset</button>

                <p>💰 Total for PS ${psNumber}: <span id="totalPrice_${psNumber}">${count * gamePrice}</span> Birr</p>
            `;

            countersDiv.appendChild(counter);
        }

        function updateCount(psNumber, change) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            let oldCount = count;

            // For the first counter, you allow both + and -
            count = Math.max(0, count + change);
            localStorage.setItem(`ps_${psNumber}_games`, count);
            document.getElementById(`count_${psNumber}`).innerText = count;

            // Update price for the current PS number
            updatePrice(psNumber, oldCount, count);

            // Update the second counter (total games and total revenue) when "+" is clicked
            if (change === 1) {
                totalGamesPlayed += 1;
                totalRevenue += gamePrice;
            }

            // Update global totals
            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        function resetCount(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            totalGamesPlayed -= count;
            totalRevenue -= count * gamePrice;

            localStorage.setItem(`ps_${psNumber}_games`, 0);
            document.getElementById(`count_${psNumber}`).innerText = 0;

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;

            updatePrice(psNumber, count, 0);
        }

        function updatePrice(psNumber, oldCount, count) {
            let totalPrice = count * gamePrice;
            document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;
        }

        function resetAll() {
            // Reset all counters in localStorage
            for (let i = 1; i <= numPS; i++) {
                localStorage.setItem(`ps_${i}_games`, 0);
                document.getElementById(`count_${i}`).innerText = 0;
                document.getElementById(`totalPrice_${i}`).innerText = 0;
            }

            // Reset global totals
            totalGamesPlayed = 0;
            totalRevenue = 0;
            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        for (let i = 1; i <= numPS; i++) {
            createCounter(i);
        }

        // Initialize the total counters on page load
        updateTotalRevenue();

        function updateTotalRevenue() {
            totalGamesPlayed = 0;
            totalRevenue = 0;

            for (let i = 1; i <= numPS; i++) {
                let count = parseInt(localStorage.getItem(`ps_${i}_games`) || 0);
                totalGamesPlayed += count;
                totalRevenue += count * gamePrice;
            }

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }
    </script>
</body>
</html>
