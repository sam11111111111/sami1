<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            background-image: url('psss.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Header */
        h2 {
            font-size: 20px;
            margin-top: 10px;
        }

        /* Container for counters */
        .counter-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            margin: 10px 0;
        }

        /* Counter Box */
        .counter {
            background: rgba(42, 42, 59, 0.8);
            padding: 15px;
            border-radius: 10px;
            width: 150px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Bottom Section for Total Revenue */
        .bottom-section {
            position: fixed;
            bottom: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .total-box {
            display: flex;
            gap: 15px;
        }

        .total-revenue, .total-games {
            background: #ff9800;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 150px;
            text-align: center;
        }

        /* Buttons */
        button {
            font-size: 14px;
            padding: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .counter-container {
                flex-direction: column;
                align-items: center;
            }

            .total-box {
                flex-direction: column;
                align-items: center;
            }

            .counter {
                width: 200px;
            }

            .total-revenue, .total-games {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>

    <div class="counter-container" id="counters"></div>

    <div class="bottom-section">
        <div class="total-box">
            <div class="total-revenue">
                💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> Birr
            </div>
            <div class="total-games">
                🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span>
            </div>
        </div>
        <button class="reset" onclick="resetAll()">Reset All</button>
    </div>

    <script>
        const numPS = 3;
        const gamePrice = 7;
        const countersDiv = document.getElementById("counters");

        let totalGamesPlayed = 0;
        let totalRevenue = 0;

        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${psNumber}</h3>
                <h2>ጨዋታ:</h2> <span id="count_${psNumber}">${count}</span>
                <button class="increase" onclick="updateCount(${psNumber}, 1)">+1</button>
                <button class="decrease" onclick="updateCount(${psNumber}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${psNumber})">Reset</button>
                <h4>💰 <span id="totalPrice_${psNumber}">${count * gamePrice}</span> Birr</h4>
            `;

            countersDiv.appendChild(counter);
        }

        function updateCount(psNumber, change) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            let oldCount = count;

            count = Math.max(0, count + change);
            localStorage.setItem(`ps_${psNumber}_games`, count);
            document.getElementById(`count_${psNumber}`).innerText = count;

            updatePrice(psNumber, oldCount, count);

            if (change === 1) {
                totalGamesPlayed += 1;
                totalRevenue += gamePrice;
            }

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        function resetCount(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            totalGamesPlayed -= count;
            totalRevenue -= count * gamePrice;

            localStorage.setItem(`ps_${psNumber}_games`, 0);
            document.getElementById(`count_${psNumber}`).innerText = 0;

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;

            updatePrice(psNumber, count, 0);
        }

        function updatePrice(psNumber, oldCount, count) {
            let totalPrice = count * gamePrice;
            document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;
        }

        function resetAll() {
            for (let i = 1; i <= numPS; i++) {
                localStorage.setItem(`ps_${i}_games`, 0);
                document.getElementById(`count_${i}`).innerText = 0;
                document.getElementById(`totalPrice_${i}`).innerText = 0;
            }

            totalGamesPlayed = 0;
            totalRevenue = 0;
            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        for (let i = 1; i <= numPS; i++) {
            createCounter(i);
        }

        updateTotalRevenue();

        function updateTotalRevenue() {
            totalGamesPlayed = 0;
            totalRevenue = 0;

            for (let i = 1; i <= numPS; i++) {
                let count = parseInt(localStorage.getItem(`ps_${i}_games`) || 0);
                totalGamesPlayed += count;
                totalRevenue += count * gamePrice;
            }

            document.getElementById("totalGames").innerText = totalGamesPlayed;
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }
    </script>
</body>
</html>
