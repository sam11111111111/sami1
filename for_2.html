<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Ensure content is evenly spaced */
            align-items: center;
            overflow: hidden; /* Prevent scrolling */
        }
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            width: 100%;
            max-width: 600px;
            gap: 10px;
            flex-grow: 1; /* Allow container to take up the space */
            margin-bottom: 20px;
        }
        .counter {
            background: #2a2a3b;
            padding: 10px;
            border-radius: 10px;
            width: 120px; /* Adjust width for smaller screens */
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px; /* Fixed height */
        }
        button {
            font-size: 10px;
            padding: 5px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        .total-revenue {
            background: #ff9800;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }
        @media (max-width: 600px) {
            h2 {
                font-size: 16px;
            }
            .counter {
                width: 100px; /* Adjust width for very small screens */
                font-size: 10px;
                height: 150px; /* Adjust height for small screens */
            }
            .total-revenue {
                font-size: 12px;
                width: 90%;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>
    <div class="container" id="counters"></div>

    <div class="total-revenue">
        💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> Birr
    </div>

    <script>
        const numPS = 3;
        const gamePrice = 7;
        const countersDiv = document.getElementById("counters");

        function createCounter(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            let winsA = parseInt(localStorage.getItem(`ps_${psNumber}_A`) || 0);
            let winsB = parseInt(localStorage.getItem(`ps_${psNumber}_B`) || 0);

            const counter = document.createElement("div");
            counter.classList.add("counter");
            counter.innerHTML = `
                <h3>🕹️ PS ${psNumber}</h3>
                <p>ጨዋታ: <span id="count_${psNumber}">${count}</span></p>
                <button class="increase" onclick="updateCount(${psNumber}, 1)">+1</button>
                <button class="decrease" onclick="updateCount(${psNumber}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${psNumber})">Reset</button>

                <p>🏆 Wins A: <span id="winsA_${psNumber}">${winsA}</span> | B: <span id="winsB_${psNumber}">${winsB}</span></p>
                <button class="increase" onclick="updateWins(${psNumber}, 'A', 1)">+1 A</button>
                <button class="increase" onclick="updateWins(${psNumber}, 'B', 1)">+1 B</button>
                <button class="reset" onclick="resetWins(${psNumber})">Reset Wins</button>

                <p>💰 Total: <span id="totalPrice_${psNumber}">${(count + winsA + winsB) * gamePrice}</span> Birr</p>
            `;

            countersDiv.appendChild(counter);
        }

        function updateCount(psNumber, change) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem(`ps_${psNumber}_games`, count);
            document.getElementById(`count_${psNumber}`).innerText = count;
            updatePrice(psNumber);
        }

        function resetCount(psNumber) {
            localStorage.setItem(`ps_${psNumber}_games`, 0);
            document.getElementById(`count_${psNumber}`).innerText = 0;
            updatePrice(psNumber);
        }

        function updateWins(psNumber, player, change) {
            let wins = parseInt(localStorage.getItem(`ps_${psNumber}_${player}`) || 0);
            wins = Math.max(0, wins + change);
            localStorage.setItem(`ps_${psNumber}_${player}`, wins);
            document.getElementById(`wins${player}_${psNumber}`).innerText = wins;
            updatePrice(psNumber);
        }

        function resetWins(psNumber) {
            localStorage.setItem(`ps_${psNumber}_A`, 0);
            localStorage.setItem(`ps_${psNumber}_B`, 0);
            document.getElementById(`winsA_${psNumber}`).innerText = 0;
            document.getElementById(`winsB_${psNumber}`).innerText = 0;
            updatePrice(psNumber);
        }

        function updatePrice(psNumber) {
            let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
            let winsA = parseInt(localStorage.getItem(`ps_${psNumber}_A`) || 0);
            let winsB = parseInt(localStorage.getItem(`ps_${psNumber}_B`) || 0);
            let totalPrice = (count + winsA + winsB) * gamePrice;
            document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;
            updateTotalRevenue();
        }

        function updateTotalRevenue() {
            let totalRevenue = 0;
            for (let i = 1; i <= numPS; i++) {
                let count = parseInt(localStorage.getItem(`ps_${i}_games`) || 0);
                let winsA = parseInt(localStorage.getItem(`ps_${i}_A`) || 0);
                let winsB = parseInt(localStorage.getItem(`ps_${i}_B`) || 0);
                totalRevenue += (count + winsA + winsB) * gamePrice;
            }
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        for (let i = 1; i <= numPS; i++) {
            createCounter(i);
        }

        updateTotalRevenue();
    </script>
</body>
</html>
