<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Game Counter</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            background-color: #1e1e2e;
            color: #ffffff;
            overflow: hidden; /* Prevent scrolling */
        }
        h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-areas:
                "ps1 ps2"
                "ps3 ps3";
            gap: 10px;
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 5px;
        }
        .counter {
            background: #2a2a3b;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        #ps1 { grid-area: ps1; }
        #ps2 { grid-area: ps2; }
        #ps3 { grid-area: ps3; }

        h3 { font-size: 14px; margin-bottom: 5px; }
        p { font-size: 12px; font-weight: bold; margin: 5px 0; }
        button {
            font-size: 12px;
            padding: 4px 8px;
            margin: 3px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset { background-color: #008CBA; color: white; }
        button:hover { opacity: 0.8; }
        .total-revenue {
            background: #ff9800;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 250px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h2>🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>
    <div class="container">
        <div class="counter" id="ps1"></div>
        <div class="counter" id="ps2"></div>
        <div class="counter" id="ps3"></div>
    </div>

    <div class="total-revenue">
        💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> Birr
    </div>

    <script>
        const numPS5 = 3;
        const gamePrice = 7;

        function createCounter(ps5Number) {
            let count = parseInt(localStorage.getItem(`ps5_${ps5Number}_games`) || 0);
            let winsA = parseInt(localStorage.getItem(`ps5_${ps5Number}_A`) || 0);
            let winsB = parseInt(localStorage.getItem(`ps5_${ps5Number}_B`) || 0);

            const counter = document.getElementById(`ps${ps5Number}`);
            counter.innerHTML = `
                <h3>🕹️ PS ${ps5Number}</h3>
                <h2>ጨዋታ: <span id="count_${ps5Number}">${count}</span></h2>
                <button class="increase" onclick="updateCount(${ps5Number}, 1)">+1</button>
                <button class="decrease" onclick="updateCount(${ps5Number}, -1)">-1</button>
                <button class="reset" onclick="resetCount(${ps5Number})">Reset</button>

                <h3>🏆 Wins</h3>
                <h3>A: <span id="winsA_${ps5Number}">${winsA}</span> | B: <span id="winsB_${ps5Number}">${winsB}</span></h3>

                <button class="increase" onclick="updateWins(${ps5Number}, 'A', 1)">+1 A</button>
                <button class="increase" onclick="updateWins(${ps5Number}, 'B', 1)">+1 B</button>
                <button class="reset" onclick="resetWins(${ps5Number})">Reset Wins</button>

                <h3>💰 Total: <span id="totalPrice_${ps5Number}">${(count + winsA + winsB) * gamePrice}</span> Birr</h3>
            `;
        }

        function updateCount(ps5Number, change) {
            let count = parseInt(localStorage.getItem(`ps5_${ps5Number}_games`) || 0);
            count = Math.max(0, count + change);
            localStorage.setItem(`ps5_${ps5Number}_games`, count);
            document.getElementById(`count_${ps5Number}`).innerText = count;
            updatePrice(ps5Number);
        }

        function resetCount(ps5Number) {
            localStorage.setItem(`ps5_${ps5Number}_games`, 0);
            document.getElementById(`count_${ps5Number}`).innerText = 0;
            updatePrice(ps5Number);
        }

        function updateWins(ps5Number, player, change) {
            let wins = parseInt(localStorage.getItem(`ps5_${ps5Number}_${player}`) || 0);
            wins = Math.max(0, wins + change);
            localStorage.setItem(`ps5_${ps5Number}_${player}`, wins);
            document.getElementById(`wins${player}_${ps5Number}`).innerText = wins;
            updatePrice(ps5Number);
        }

        function resetWins(ps5Number) {
            localStorage.setItem(`ps5_${ps5Number}_A`, 0);
            localStorage.setItem(`ps5_${ps5Number}_B`, 0);
            document.getElementById(`winsA_${ps5Number}`).innerText = 0;
            document.getElementById(`winsB_${ps5Number}`).innerText = 0;
            updatePrice(ps5Number);
        }

        function updatePrice(ps5Number) {
            let count = parseInt(localStorage.getItem(`ps5_${ps5Number}_games`) || 0);
            let winsA = parseInt(localStorage.getItem(`ps5_${ps5Number}_A`) || 0);
            let winsB = parseInt(localStorage.getItem(`ps5_${ps5Number}_B`) || 0);
            let totalPrice = (count + winsA + winsB) * gamePrice;
            document.getElementById(`totalPrice_${ps5Number}`).innerText = totalPrice;
            updateTotalRevenue();
        }

        function updateTotalRevenue() {
            let totalRevenue = 0;
            for (let i = 1; i <= numPS5; i++) {
                let count = parseInt(localStorage.getItem(`ps5_${i}_games`) || 0);
                let winsA = parseInt(localStorage.getItem(`ps5_${i}_A`) || 0);
                let winsB = parseInt(localStorage.getItem(`ps5_${i}_B`) || 0);
                totalRevenue += (count + winsA + winsB) * gamePrice;
            }
            document.getElementById("totalRevenue").innerText = totalRevenue;
        }

        for (let i = 1; i <= numPS5; i++) {
            createCounter(i);
        }

        updateTotalRevenue();
    </script>
</body>
</html>
