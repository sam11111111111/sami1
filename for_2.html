<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Game Counter</title>
    <style>
    
 body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #1e1e2e;
            background-image: url('ps1.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        h2 {
            font-size: 18px;
            margin-top: 10px;
        }

        /* Top Section Styling */
        .top-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: rgba(30, 30, 46, 0.9);
            padding: 10px 0;
            position: fixed;
            top: 0;
            z-index: 10;
        }

        .total-box {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .total-revenue, .total-games, .perr {
            background: #ff9800;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            width: 200px;
            text-align: center;
        }

        /* Container for PS Counters */
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1500px;
            padding: 10px;
            margin-top: 99px; /* Adjust for fixed top-section */
        }

        .counter {
            padding: 5px;
            border-radius: 15px;
            width: 180px;
            height: 250px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        /* Bottom Section */
         .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
           
            padding: 10px 0;
            position: fixed;
            top: 40px;
            z-index: 10;
        }

       

        button {
            font-size: 14px;
            padding: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .increase { background-color: #4CAF50; color: white; }
        .decrease { background-color: #f44336; color: white; }
        .reset {
            background-color: #008CBA; 
            color: white; 



        }
        .timer {  color: black; border-radius:50px }
.tim{
position: fixed;
bottom: 35px;
}
        .reset-bottom {
            background: #ff5722;
            color: white;
            padding: 10px;
            border-radius: 5px;
            position: fixed;
            bottom: 2px;
        }
    

#bun {


  position: relative;
  animation-name: jo;
  animation-duration: 3s;  
  animation-fill-mode: forwards;
}

@keyframes jo {
  from {top: 250px;}
  to {top: 0px; background-color: #BE7B72;}
  
}







.sidenav {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidenav a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.sidenav .closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  margin-left: 50px;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

#menu{
    position: fixed;
    top: 10px;
    left: 10px;
}

    </style>
</head>
<body>
    <h2 id="bun">🎮 JO PS የጨዋታ ቆጣሪ 🎮</h2>

    <div class="container" id="counters"></div>

    <div class="bottom-section">
        <a href="register.html">🏆 CUP 🏆</a>
        <div class="total-box">
            <div class="total-revenue">
                💰 አጠቃላይ ገቢ: <span id="totalRevenue">0</span> ብር
            </div>
            <div class="total-games">
                🎮 አጠቃላይ ጨዋታዎች: <span id="totalGames">0</span>
            </div>
            <div class="perr"> 
                🏦 ቁጠባ: <span id="per">0</span> ብር
            </div>
        </div>

<span style="font-size:30px;cursor:pointer" onclick="openNav()" id="menu">&#9776; </span>


<div id="mySidenav" class="sidenav">
    Menu
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
 <button> <a href="background.html">Wallepaper</a>
</button>
  <a href="background.html">Contact</a>
</div>
    </div>
    <button class="reset reset-bottom" onclick="confirmReset()" >Reset All</button>


   <script>
        // Apply saved background
        document.body.style.backgroundImage = `url(${localStorage.getItem("bgImage") || 'https://source.unsplash.com/1920x1080?nature'})`;
    </script>


<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
}



    window.addEventListener("resize", () => {
    document.querySelector(".bottom-section").style.bottom = "20px";
});

     const numPS = 3;
    const gamePrice = 7;
    const adminPIN = "1234";
    let timers = {};

    const countersDiv = document.getElementById("counters");

    let totalGamesPlayed = parseInt(localStorage.getItem("totalGamesPlayed")) || 0;
    let totalRevenue = parseInt(localStorage.getItem("totalRevenue")) || 0;

    function createCounter(psNumber) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);

        const counter = document.createElement("div");
        counter.classList.add("counter");
        counter.innerHTML = `
            <h3>🕹️ PS ${psNumber}</h3>
            <h2>ጨዋታ:</h2> <span id="count_${psNumber}">${count}</span>
            <button class="increase" onclick="updateCount(${psNumber}, 1)"> +1 </button><br>
            <button class="decrease" onclick="updateCount(${psNumber}, -1)"> -1 </button><br>
            <button class="reset" onclick="resetCount(${psNumber})"> Reset </button>
            <h4>💰 PS ${psNumber}: <span id="totalPrice_${psNumber}">${count * gamePrice}</span> ብር</h4>

            <div class="tim" >
            <h4>⏱️  <span id="timer_${psNumber}">05:00</span></h4>
            <button class="timer" onclick="startTimer(${psNumber})">⏳</button>
            <button class="stop-timer timer" onclick="stopTimer(${psNumber})">⏹</button>
            <button class="reset-timer timer" onclick="resetTimer(${psNumber})">🔄</button>
            </div>
        `;

        countersDiv.appendChild(counter);
    }

function startTimer(psNumber) {
    if (timers[psNumber]) return;

    let timeLeft = parseInt(localStorage.getItem(`timer_${psNumber}`)) || 300;
    let timerDisplay = document.getElementById(`timer_${psNumber}`);

    timers[psNumber] = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timers[psNumber]);
            timers[psNumber] = null;
              if (navigator.vibrate) {
                        navigator.vibrate(1500); // Vibrate for 1200 milliseconds (1.2 seconds)
                    }

                    // Wait until vibration finishes, then show the alert
                    setTimeout(() => {
                        alert(`⏳ Time's up for PS ${psNumber}!`);
                    }, 1200);
            return;
        }
        localStorage.setItem(`timer_${psNumber}`, timeLeft);
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        timeLeft--;
    }, 1000);
}

function resetTimer(psNumber) {
    stopTimer(psNumber);
    localStorage.setItem(`timer_${psNumber}`, 300);
    document.getElementById(`timer_${psNumber}`).innerText = "05:00";
}


    function stopTimer(psNumber) {
        clearInterval(timers[psNumber]);
        timers[psNumber] = null;
    }




    function updateCount(psNumber, change) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
        count = Math.max(0, count + change);
        localStorage.setItem(`ps_${psNumber}_games`, count);
        document.getElementById(`count_${psNumber}`).innerText = count;

        document.getElementById(`totalPrice_${psNumber}`).innerText = count * gamePrice;
        totalGamesPlayed += (change === 1 ? 1 : 0);
        totalRevenue += (change === 1 ? gamePrice : 0);

        localStorage.setItem("totalGamesPlayed", totalGamesPlayed);
        localStorage.setItem("totalRevenue", totalRevenue);

        document.getElementById("totalGames").innerText = totalGamesPlayed;
        document.getElementById("totalRevenue").innerText = totalRevenue;
        document.getElementById("per").innerText = (totalRevenue * 20) / 100;
    }



    function resetCount(psNumber) {
        let count = parseInt(localStorage.getItem(`ps_${psNumber}_games`) || 0);
        localStorage.setItem(`ps_${psNumber}_games`, 0);
        document.getElementById(`count_${psNumber}`).innerText = 0;
        updatePrice(psNumber, count, 0);
    }

    function updatePrice(psNumber, oldCount, count) {
        let totalPrice = count * gamePrice;
        document.getElementById(`totalPrice_${psNumber}`).innerText = totalPrice;
    }

    function confirmReset() {
        let userPIN = prompt("🔐 Enter Admin PIN to Reset:");
        if (userPIN === adminPIN) {
            resetAll();
            alert("✅ All data has been reset!");
        } else {
            alert("❌ Incorrect PIN! Reset Canceled.");
        }
    }

    function resetAll() {
        for (let i = 1; i <= numPS; i++) {
            localStorage.setItem(`ps_${i}_games`, 0);
            document.getElementById(`count_${i}`).innerText = 0;
            document.getElementById(`totalPrice_${i}`).innerText = 0;
        }

        totalGamesPlayed = 0;
        totalRevenue = 0;
        localStorage.setItem("totalGamesPlayed", totalGamesPlayed);
        localStorage.setItem("totalRevenue", totalRevenue);

        document.getElementById("totalGames").innerText = totalGamesPlayed;
        document.getElementById("totalRevenue").innerText = totalRevenue;
        document.getElementById("per").innerText = 0;
    }

    for (let i = 1; i <= numPS; i++) {
        createCounter(i);
    }

    updateTotalRevenue();

    function updateTotalRevenue() {
        totalGamesPlayed = parseInt(localStorage.getItem("totalGamesPlayed")) || 0;
        totalRevenue = parseInt(localStorage.getItem("totalRevenue")) || 0;

        let savings = (totalRevenue * 20) / 100;

        document.getElementById("totalGames").innerText = totalGamesPlayed;
        document.getElementById("totalRevenue").innerText = totalRevenue;
        document.getElementById("per").innerText = savings;
    }
    

</script>

</body>
</html>
